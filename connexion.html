<body>

    <div class="login-container">
        <h1>ChatBook</h1>
        <p>Connectez-vous pour voir les messages et vidéos de vos proches.</p>
        
        <form id="formConnexion">
            <div class="input-group">
                <input type="email" id="loginEmail" placeholder="Ex: monadresse@gmail.com" required autocomplete="username">
            </div>
            <div class="input-group">
                <input type="password" id="loginPassword" placeholder="Votre mot de passe" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login" id="submitBtn">Se connecter</button>
        </form>

        <div class="footer-links">
            <a href="#">Mot de passe oublié ?</a>
            <br>
            <a href="inscription.html?v=12" class="btn-register">Créer un nouveau compte</a>
        </div>
    </div>

    <script>
        // Configuration de tes accès Supabase personnels
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_KEY = "sb_publishable_DucLDxgJL-poE8KrN_9bnA_K-D0aGOS";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // SYSTÈME DE VÉRIFICATION EN DIRECT DANS LA BASE DE DONNÉES
        document.getElementById('formConnexion').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const emailField = document.getElementById('loginEmail').value.trim();
            const passwordField = document.getElementById('loginPassword').value;
            const btn = document.getElementById('submitBtn');

            btn.innerText = "Vérification en cours...";
            btn.disabled = true;

            // Requête SQL automatique pour chercher si l'utilisateur existe
            const { data, error } = await supabase
                .from('utilisateurs')
                .select('*')
                .eq('email', emailField)
                .eq('mot_de_passe', passwordField);

            if (error) {
                alert("Erreur serveur : " + error.message);
                btn.innerText = "Se connecter";
                btn.disabled = false;
            } else if (data.length === 0) {
                // Si la base de données ne trouve aucune correspondance
                alert("❌ Aucun compte trouvé avec ces identifiants. Vérifiez votre e-mail ou mot de passe !");
                btn.innerText = "Se connecter";
                btn.disabled = false;
            } else {
                // Si la personne est bien inscrite dans ton tableau noir Supabase
                alert("✅ Connexion réussie ! Bienvenue sur ChatBook, " + data[0].prenom + " !");
                window.location.href = "index.html?v=12";
            }
        });
    </script>
