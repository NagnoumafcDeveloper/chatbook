<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBook - Connexion</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            width: 100%;
            max-width: 350px;
            padding: 20px;
            text-align: center;
        }
        h2 {
            font-size: 32px;
            color: #e50914;
            margin-bottom: 30px;
        }
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 25px;
            background-color: #111;
            color: white;
            box-sizing: border-box;
            font-size: 16px;
        }
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #aaa;
            user-select: none;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 25px;
            background-color: #e50914;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .signup-link {
            margin-top: 20px;
            display: block;
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
        }
        .signup-link span {
            color: #e50914;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>ChatBook</h2>
    
    <form id="loginForm">
        <div class="input-group">
            <input type="text" placeholder="Email ou nom d'utilisateur" required>
        </div>
        
        <div class="input-group">
            <input type="password" id="password" placeholder="Mot de passe" required>
            <span class="password-toggle" id="togglePassword">👁️</span>
        </div>
        
        <button type="submit" class="btn-login">Se connecter</button>
    </form>
    
    <a href="#" class="signup-link">Nouveau sur ChatBook ? <span>Inscrivez-vous</span></a>
</div>

<script>
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#password');

    togglePassword.addEventListener('click', function () {
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        this.textContent = type === 'password' ? '👁️' : '🙈';
    });
</script>

</body>
</html>
