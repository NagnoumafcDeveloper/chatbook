<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChatBook - Connexion</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1877f2, #0056b3);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .login-container h1 {
            color: #1877f2;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .login-container p {
            color: #606770;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            font-size: 1rem;
            border: 1px solid #ccd0d5;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
            -webkit-appearance: none;
        }

        .input-group input:focus {
            border-color: #1877f2;
            box-shadow: 0 0 0 2px rgba(24, 119, 242, 0.2);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            background-color: #1877f2;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
            -webkit-appearance: none;
        }

        .btn-login:active {
            background-color: #166fe5;
        }

        .footer-links {
            margin-top: 20px;
            border-top: 1px solid #e4e6eb;
            padding-top: 20px;
        }

        .footer-links a {
            color: #1877f2;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .btn-register {
            display: inline-block;
            margin-top: 15px;
            background-color: #42b72a;
            color: white;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>ChatBook</h1>
        <p>Connectez-vous pour voir les messages et vidéos de vos proches.</p>
        
        <!-- Action modifiée pour aller vers chat.html -->
        <form action="chat.html" method="GET">
            <div class="input-group">
                <input type="email" placeholder="Ex: monadresse@gmail.com" required autocomplete="username">
            </div>
            
            <div class="input-group">
                <input type="password" placeholder="Votre mot de passe" required autocomplete="current-password">
            </div>
            
            <button type="submit" class="btn-login">Se connecter</button>
        </form>

        <div class="footer-links">
            <a href="#">Mot de passe oublié ?</a>
        </div>
    </div>

</body>
</html>
