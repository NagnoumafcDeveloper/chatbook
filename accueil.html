<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatBook</title>
<style>
body{background:#eef4ff;margin:0;font-family:Arial}
.header{background:#fff;padding:12px;position:sticky;top:0}
.logo{font-weight:900;font-size:22px}.logo span{color:#0a7cff}
.search{background:#f0f2f5;border-radius:20px;padding:10px;margin-top:8px}
.search input{border:none;background:transparent;width:100%;outline:none}
.cats{display:flex;gap:6px;margin-top:8px}
.cat{padding:6px 10px;border-radius:12px;border:none;background:#e4e6eb}
.cat.active{background:#0a7cff;color:#fff}
.feed{display:flex;flex-direction:column;align-items:center;padding:10px;gap:12px}
.box{position:relative;width:95%;max-width:400px;background:#000;border-radius:16px;overflow:hidden;height:75vh}
.box video{width:100%;height:100%;object-fit:cover}
.info{position:absolute;left:10px;bottom:10px;color:#fff;text-shadow:0 1px 3px #000}
.actions{position:absolute;right:8px;bottom:10px;display:flex;flex-direction:column;gap:16px;text-align:center}
.act{cursor:pointer}
.act div{font-size:30px;color:#fff;text-shadow:0 1px 3px #000}
.act.liked div{color:#fe2c55}
.act.saved div{color:#ffcc00}
.act span{color:#fff;font-size:11px;font-weight:bold;text-shadow:0 1px 3px #000}
.bottom{height:50px;background:#fff;display:flex;justify-content:space-around;align-items:center;position:fixed;bottom:0;width:100%;border-top:1px solid #ddd}
</style>
</head>
<body>
<div class="header">
<div class="logo"><span>Chat</span>Book</div>
<div class="search"><input placeholder="Rechercher" oninput="doSearch(this.value)"></div>
<div class="cats">
<button class="cat active" onclick="fil('tous',this)">Tous</button>
<button class="cat" onclick="fil('humour',this)">Humour</button>
<button class="cat" onclick="fil('motivation',this)">Motivation</button>
</div>
</div>

<div class="feed" id="feed"></div>

<div class="bottom">
<button>Accueil</button>
<button onclick="document.getElementById('up').click()">Publier</button>
<button onclick="location.href='inscription.html'">Profil</button>
</div>

<input type="file" id="up" accept="video/*" style="display:none" onchange="addV(this)">

<script>
let data=[
 {url:"https://www.w3schools.com/html/mov_bbb.mp4",user:"@dakar_comedy",likes:12300,desc:"Trop drôle 😂",coms:0},
 {url:"https://www.w3schools.com/html/movie.mp4",user:"@motivation_sn",likes:45000,desc:"N'abandonne jamais 💪",coms:0},
];
let saved=new Set();
function render(arr){
 let f=document.getElementById('feed');f.innerHTML="";
 arr.forEach((v,i)=>{
  f.innerHTML+=`<div class="box">
   <video src="${v.url}" loop muted playsinline id="vid${i}" onclick="this.paused?this.play():this.pause()"></video>
   <div class="info"><b>${v.user}</b><br>${v.desc}</div>
   <div class="actions">
     <div class="act" id="like${i}" onclick="like(${i})"><div>🤍</div><span id="lc${i}">${format(v.likes)}</span></div>
     <div class="act" onclick="openCom(${i})"><div>💬</div><span id="c${i}">${v.coms}</span></div>
     <div class="act" id="save${i}" onclick="saveV(${i})"><div>☆</div><span>Favoris</span></div>
     <div class="act" onclick="shareV()"><div>↗️</div><span>Partage</span></div>
     <div class="act" onclick="togSound(${i})"><div id="s${i}">🔇</div><span>Son</span></div>
   </div>
  </div>`;
 });
}
function format(n){return n>=1000?(n/1000).toFixed(1)+'k':n}
function togSound(i){let v=document.getElementById('vid'+i);v.muted=!v.muted;document.getElementById('s'+i).textContent=v.muted?'🔇':'🔊';}
function like(i){let el=document.getElementById('like'+i);let ic=el.querySelector('div');if(el.classList.contains('liked')){el.classList.remove('liked');ic.textContent='🤍';data[i].likes--;}else{el.classList.add('liked');ic.textContent='❤️';data[i].likes++;}document.getElementById('lc'+i).textContent=format(data[i].likes);}
function saveV(i){let el=document.getElementById('save'+i);let ic=el.querySelector('div');if(saved.has(i)){saved.delete(i);el.classList.remove('saved');ic.textContent='☆';}else{saved.add(i);el.classList.add('saved');ic.textContent='★';}}
function openCom(i){let t=prompt('Commentaire:');if(t){data[i].coms++;document.getElementById('c'+i).textContent=data[i].coms;}}
function shareV(){alert('Lien copié: '+location.href);}
function fil(c,b){document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(c=='tous')render(data);else render(data.filter(d=>d.cat==c));}
function doSearch(q){q=q.toLowerCase();render(data.filter(d=>d.user.toLowerCase().includes(q)));}
function addV(inp){let f=inp.files[0];if(!f)return;let u=URL.createObjectURL(f);data.unshift({url:u,user:"@moi",likes:0,desc:"Ma vidéo",cat:"tous",coms:0});render(data);}
render(data);
</script>
</body>
</html>
