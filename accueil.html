<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBook - Pour vous</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #050505;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            background-color: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #1a1a1a;
            border-right: 1px solid #1a1a1a;
            box-sizing: border-box;
            box-shadow: 0 0 30px rgba(229, 9, 20, 0.1);
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #000000;
            border-bottom: 1px solid #111;
        }

        .logo {
            color: #e50914;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-tabs {
            font-size: 14px;
            color: #777777;
        }

        .nav-tabs span {
            cursor: pointer;
            padding: 5px 10px;
        }

        .nav-tabs .active {
            color: #ffffff;
            font-weight: bold;
            border-bottom: 2px solid #e50914;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 9/16;
            background-color: #0a0a0a;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-details {
            padding: 15px;
            background-color: #000000;
        }

        .author {
            font-weight: bold;
            font-size: 16px;
            color: #ffffff;
            margin-bottom: 5px;
        }

        .description {
            font-size: 14px;
            color: #cccccc;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .hashtag {
            color: #e50914;
            font-weight: 500;
        }

        .action-bar {
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #111;
            border-bottom: 1px solid #111;
            background-color: #050505;
        }

        .action-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff; /* Le texte reste toujours blanc */
            font-size: 14px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px 10px;
            border-radius: 20px;
            transition: background-color 0.2s;
        }

        .action-item:hover {
            background-color: #111111;
        }

        /* Style des icônes de base (blanches) */
        .icon-svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
            transition: fill 0.2s, stroke 0.2s;
        }

        /* Quand on clique : l'icône se remplit de rouge vif */
        .action-item.active .icon-svg {
            fill: #e50914;
            stroke: #e50914;
        }

        .comments-section {
            padding: 15px;
            flex: 1;
        }

        .comments-title {
            font-size: 14px;
            color: #777777;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .comment-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .comment-item {
            font-size: 14px;
            line-height: 1.4;
        }

        .comment-user {
            font-weight: bold;
            color: #ffffff;
            margin-right: 5px;
        }

        .comment-text {
            color: #bbbbbb;
        }

        .comment-box {
            display: flex;
            gap: 10px;
            padding: 10px 0;
        }

        .comment-box input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #222222;
            border-radius: 25px;
            background-color: #111111;
            color: #ffffff;
            font-size: 14px;
        }

        .comment-box input:focus {
            outline: none;
            border-color: #e50914;
        }

        .btn-publish {
            background-color: #e50914;
            color: #ffffff;
            border: none;
            padding: 0 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-publish:hover {
            background-color: #b80710;
        }

        .ads-footer {
            text-align: center;
            padding: 15px;
            font-size: 11px;
            color: #444444;
            letter-spacing: 1px;
            border-top: 1px solid #111;
            background-color: #000000;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <a href="index.html" class="logo">ChatBook</a>
            <div class="nav-tabs">
                <span>Abonnements</span>
                <span class="active">Pour vous</span>
            </div>
        </header>

        <div class="video-wrapper">
            <video autoplay loop muted playsinline>
                <source src="https://mixkit.co" type="video/mp4">
                Votre navigateur ne supporte pas les vidéos.
            </video>
        </div>

        <div class="video-details">
            <div class="author">@NagnoumaDeveloper</div>
            <div class="description">
                Bienvenue sur le flux vidéo officiel de ChatBook ! 🚀✨ 🔥 <span class="hashtag">#tech</span>
            </div>
        </div>

        <!-- Barre d'actions réorganisée avec le commentaire au milieu et les icônes SVG de haute qualité -->
        <div class="action-bar">
            <!-- Bouton Like (Cœur) -->
            <button class="action-item" id="likeBtn">
                <svg class="icon-svg" viewBox="0 0 24 24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
                <span id="likeCount">12.5K</span>
            </button>

            <!-- Bouton Commentaire (Bulle) placé au milieu -->
            <button class="action-item" id="commentBarBtn">
                <svg class="icon-svg" viewBox="0 0 24 24" style="fill: none; stroke: #fff;">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                <span id="commentCount">1</span>
            </button>

            <!-- Bouton Favoris (Étoile) -->
            <button class="action-item" id="favBtn">
                <svg class="icon-svg" viewBox="0 0 24 24">
                    <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                </svg>
                <span>Favoris</span>
            </button>
        </div>

        <div class="comments-section">
            <div class="comments-title">Commentaires</div>
            
            <div class="comment-list" id="commentList">
                <div class="comment-item">
                    <span class="comment-user">@Moi:</span>
                    <span class="comment-text">cc</span>
                </div>
            </div>

            <form class="comment-box" id="commentForm">
                <input type="text" id="commentInput" placeholder="Ajouter un commentaire..." autocomplete="off" required>
                <button type="submit" class="btn-publish">Publier</button>
            </form>
        </div>

        <footer class="ads-footer">
            ANNONCE PUBLICITAIRE • ESPACE ADMOB / FACEBOOK ADS
        </footer>
    </div>

    <script>
        // Interaction dynamique du cœur (Se remplit en rouge, texte reste blanc)
        const likeBtn = document.getElementById('likeBtn');
        const likeCount = document.getElementById('likeCount');
        let isLiked = false;

        likeBtn.addEventListener('click', function() {
            isLiked = !isLiked;
            if(isLiked) {
                this.classList.add('active');
                likeCount.textContent = "12.6K";
            } else {
                this.classList.remove('active');
                likeCount.textContent = "12.5K";
            }
        });

        // Interaction dynamique de l'étoile (Se remplit en rouge, texte reste blanc)
        const favBtn = document.getElementById('favBtn');
        let isFav = false;

        favBtn.addEventListener('click', function() {
            isFav = !isFav;
            if(isFav) {
                this.classList.add('active');
            } else {
                this.classList.remove('active');
            }
        });

        // Focus le champ de saisie si on clique sur le bouton commentaire de la barre
        document.getElementById('commentBarBtn').addEventListener('click', function() {
            document.getElementById('commentInput').focus();
        });

        // Ajout dynamique des commentaires
        const commentForm = document.getElementById('commentForm');
        const commentInput = document.getElementById('commentInput');
