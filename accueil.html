<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBook - L'app vidéos 100% sénégalaise</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #141414;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Barre latérale gauche */
        .sidebar {
            width: 240px;
            background-color: #000000;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid #222;
            box-sizing: border-box;
        }

        .logo {
            color: #e50914;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            margin-bottom: 10px;
        }

        .search-bar {
            width: 100%;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #333;
            background-color: #1a1a1a;
            color: white;
            box-sizing: border-box;
        }

        .menu-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu-item {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border-radius: 8px;
        }

        .menu-item:hover, .menu-item.active {
            background-color: #1a1a1a;
            color: #e50914;
        }

        .btn-sidebar-login {
            background-color: #e50914;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: auto;
            width: 100%;
            text-align: center;
            text-decoration: none;
        }

        .btn-sidebar-login:hover {
            background-color: #b80710;
        }

        /* Zone centrale de la vidéo */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0a0a0a;
            position: relative;
        }

        .video-container {
            width: 100%;
            max-width: 400px;
            height: 85vh;
            background-color: #111;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        /* Image lapin temporaire imitant la vidéo */
        .video-placeholder {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Boutons d'interactions à droite de la vidéo */
        .video-actions {
            position: absolute;
            right: 15px;
            bottom: 100px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .action-button {
            background: rgba(0, 0, 0, 0.5);
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .action-label {
            font-size: 12px;
            color: #aaa;
            margin-top: -15px;
        }

        /* Infos de la vidéo en bas */
        .video-info {
            position: absolute;
            left: 15px;
            bottom: 20px;
            right: 80px;
        }

        .username {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .hashtag {
            color: #e50914;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Barre latérale -->
    <div class="sidebar">
        <a href="#" class="logo">ChatBook</a>
        <input type="text" class="search-bar" placeholder="Rechercher">
        
        <div class="menu-links">
            <a href="#" class="menu-item active">🏠 Pour toi</a>
            <a href="#" class="menu-item">🧭 Explorer</a>
            <a href="#" class="menu-item">👥 Suivis</a>
            <a href="#" class="menu-item">📺 LIVE</a>
            <a href="#" class="menu-item">➕ Importer</a>
            <a href="#" class="menu-item">👤 Profil</a>
        </div>

        <!-- Bouton de connexion fonctionnel relié au fichier connexion.html -->
        <a href="connexion.html" class="btn-sidebar-login">Se connecter</a>
    </div>

    <!-- Zone principale -->
    <div class="main-content">
        <div class="video-container">
            <img class="video-placeholder" src="https://wikimedia.org" alt="Video">
            
            <div class="video-actions">
                <button class="action-button" style="color: #e50914;">❤️</button>
                <span class="action-label">37.7K</span>
                
                <button class="action-button">💬</button>
                <span class="action-label">1354</span>
                
                <button class="action-button" style="color: #ffb300;">⭐</button>
                <span class="action-label">7.3K</span>
            </div>

            <div class="video-info">
                <div class="username">SENEGALESEBOYZ SN</div>
                <div class="hashtag">#humoursenegal</div>
            </div>
        </div>
    </div>

</body>
</html>
