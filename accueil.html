<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBook - Pour vous</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #050505; /* Fond extérieur noir profond */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Conteneur principal style application mobile centrée */
        .app-container {
            width: 100%;
            max-width: 450px;
            background-color: #000000; /* Fond noir de l'application */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #1a1a1a;
            border-right: 1px solid #1a1a1a;
            box-sizing: border-box;
            box-shadow: 0 0 30px rgba(229, 9, 20, 0.1);
        }

        /* Barre supérieure (Header) */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #000000;
            border-bottom: 1px solid #111;
        }

        .logo {
            color: #e50914; /* Texte ChatBook en rouge */
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-tabs {
            font-size: 14px;
            color: #777777;
        }

        .nav-tabs span {
            cursor: pointer;
            padding: 5px 10px;
        }

        .nav-tabs .active {
            color: #ffffff;
            font-weight: bold;
            border-bottom: 2px solid #e50914; /* Barre active rouge */
        }

        /* Zone du lecteur vidéo */
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 9/16; /* Format vidéo mobile vertical */
            background-color: #0a0a0a;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Section des détails sous la vidéo */
        .video-details {
            padding: 15px;
            background-color: #000000;
        }

        .author {
            font-weight: bold;
            font-size: 16px;
            color: #ffffff;
            margin-bottom: 5px;
        }

        .description {
            font-size: 14px;
            color: #cccccc;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .hashtag {
            color: #e50914; /* Hashtags en rouge */
            font-weight: 500;
        }

        /* Barre d'actions (Likes, Commentaires, Partager) */
        .action-bar {
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #111;
            border-bottom: 1px solid #111;
            background-color: #050505;
        }

        .action-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #aaaaaa;
            font-size: 14px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px 10px;
            border-radius: 20px;
            transition: background 0.2s;
        }

        .action-item:hover {
            background-color: #111111;
            color: #e50914;
        }

        /* Section Commentaires */
        .comments-section {
            padding: 15px;
            flex: 1;
        }

        .comments-title {
            font-size: 14px;
            color: #777777;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .comment-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .comment-item {
            font-size: 14px;
            line-height: 1.4;
        }

        .comment-user {
            font-weight: bold;
            color: #ffffff;
            margin-right: 5px;
        }

        .comment-text {
            color: #bbbbbb;
        }

        /* Formulaire pour ajouter un commentaire en bas */
        .comment-box {
            display: flex;
            gap: 10px;
            padding: 10px 0;
        }

        .comment-box input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #222222;
            border-radius: 25px;
            background-color: #111111;
            color: #ffffff;
            font-size: 14px;
        }

        .comment-box input:focus {
            outline: none;
            border-color: #e50914;
        }

        .btn-publish {
            background-color: #e50914; /* Bouton Publier rouge */
            color: #ffffff;
            border: none;
            padding: 0 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-publish:hover {
            background-color: #b80710;
        }

        /* Zone publicitaire basse discrète */
        .ads-footer {
            text-align: center;
            padding: 15px;
            font-size: 11px;
            color: #444444;
            letter-spacing: 1px;
            border-top: 1px solid #111;
            background-color: #000000;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- En-tête -->
        <header class="app-header">
            <a href="index.html" class="logo">ChatBook</a>
            <div class="nav-tabs">
                <span>Abonnements</span>
                <span class="active">Pour vous</span>
            </div>
        </header>

        <!-- Lecteur Vidéo vertical fluide -->
        <div class="video-wrapper">
            <video autoplay loop muted playsinline>
                <source src="https://mixkit.co" type="video/mp4">
                Votre navigateur ne supporte pas les vidéos.
            </video>
        </div>

        <!-- Détails de la publication -->
        <div class="video-details">
            <div class="author">@NagnoumaDeveloper</div>
            <div class="description">
                Bienvenue sur le flux vidéo officiel de ChatBook ! 🚀✨ 🔥 <span class="hashtag">#tech</span>
            </div>
        </div>

        <!-- Barre d'actions statistiques -->
        <div class="action-bar">
            <button class="action-item">❤️ <span>12.5K</span></button>
            <button class="action-item">💬 <span>345</span></button>
            <button class="action-item">🔗 <span>Partager</span></button>
        </div>

        <!-- Espace commentaires -->
        <div class="comments-section">
            <div class="comments-title">Commentaires</div>
            
            <div class="comment-list" id="commentList">
                <div class="comment-item">
                    <span class="comment-user">@Utilisateur1:</span>
                    <span class="comment-text">Super application !</span>
                </div>
                <div class="comment-item">
                    <span class="comment-user">@Utilisateur2:</span>
                    <span class="comment-text">J'aime beaucoup le concept rouge et noir.</span>
                </div>
            </div>

            <!-- Ajout de commentaire -->
            <form class="comment-box" id="commentForm">
                <input type="text" id="commentInput" placeholder="Ajouter un commentaire..." autocomplete="off" required>
                <button type="submit" class="btn-publish">Publier</button>
            </form>
        </div>

        <!-- Pied de page AdMob / Facebook Ads -->
        <footer class="ads-footer">
            ANNONCE PUBLICITAIRE • ESPACE ADMOB / FACEBOOK ADS
        </footer>
    </div>

    <script>
        // Script dynamique pour ajouter des commentaires en direct
        const commentForm = document.getElementById('commentForm');
        const commentInput = document.getElementById('commentInput');
        const commentList = document.getElementById('commentList');

        commentForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newComment = document.createElement('div');
            newComment.classList.add('comment-item');
            
            newComment.innerHTML = `
                <span class="comment-user">@Moi:</span>
                <span class="comment-text">${commentInput.value}</span>
            `;
            
            commentList.appendChild(newComment);
            commentInput.value = '';
        });
    </script>
</body>
</html>
