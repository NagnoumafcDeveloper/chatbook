<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBook - Pour vous</title>
    <script>
        // BARRIÈRE DE SÉCURITÉ OBLIGATOIRE
        // Si l'utilisateur n'a pas le badge de connexion, on le renvoie directement à l'inscription
        if (localStorage.getItem('chatbook_connecte') !== 'true') {
            window.location.href = 'index.html';
        }
    </script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            background-color: #000000;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Barre supérieure fixe */
        .app-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);
            box-sizing: border-box;
            z-index: 100;
        }

        .logo {
            color: #e50914;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }

        /* Container principal pour les vidéos défilantes */
        .feed-container {
            flex: 1;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            scrollbar-width: none;
            height: 100%;
        }

        .feed-container::-webkit-scrollbar {
            display: none;
        }

        .video-section {
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            background-color: #000000;
        }

        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Boutons d'action latéraux (à droite) */
        .side-actions {
            position: absolute;
            right: 15px;
            bottom: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }

        .action-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #ffffff;
            font-size: 12px;
            text-decoration: none;
            cursor: pointer;
            background: none;
            border: none;
        }

        .icon-circle {
            width: 45px;
            height: 45px;
            background-color: rgba(30, 30, 30, 0.4);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 5px;
            backdrop-filter: blur(5px);
        }

        .icon-svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }

        /* Détails de la vidéo (en bas à gauche) */
        .video-details {
            position: absolute;
            left: 15px;
            bottom: 110px;
            max-width: 75%;
            z-index: 10;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
        }

        .author {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .description {
            font-size: 14px;
            line-height: 1.4;
            color: #eeeeee;
        }

        /* Menu de navigation inférieur fixe */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: #000000;
            border-top: 1px solid #111111;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
            padding-bottom: 10px;
            box-sizing: border-box;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #777777;
            text-decoration: none;
            font-size: 11px;
            gap: 4px;
        }

        .nav-item.active {
            color: #ffffff;
        }

        .nav-icon {
            width: 22px;
            height: 22px;
            fill: currentcolor;
        }

        /* Bouton central Publier style TikTok */
        .btn-publish {
            background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
            width: 45px;
            height: 30px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000000;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Barre supérieure -->
        <header class="app-header">
            <a href="#" class="logo" onclick="localStorage.removeItem('chatbook_connecte'); window.location.reload();">ChatBook</a>
        </header>

        <!-- Container des vidéos -->
        <div class="feed-container" id="feedContainer">
            
            <!-- VIDÉO 1 -->
            <section class="video-section">
                <div class="video-wrapper">
                    <video loop muted autoplay playsinline>
                        <source src="https://mixkit.co" type="video/mp4">
                    </video>
                </div>
                
                <!-- Boutons à droite -->
                <div class="side-actions">
                    <div class="action-button" id="likeBtn">
                        <div class="icon-circle">
                            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        </div>
                        <span id="likeCount">1,2 K</span>
                    </div>
                    <div class="action-button">
                        <div class="icon-circle">
                            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                        </div>
                        <span>128</span>
                    </div>
                    <div class="action-button">
                        <div class="icon-circle">
                            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M10 9V5l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11z"/></svg>
                        </div>
                        <span>Partager</span>
                    </div>
                </div>

                <!-- Textes en bas -->
                <div class="video-details">
                    <div class="author">@chatbook_officiel</div>
                    <div class="description">Bienvenue sur ChatBook 🌍 Découvre les vidéos et partage tes meilleurs moments</div>
                </div>
            </section>

        </div>

        <!-- Menu de navigation bas -->
        <nav class="bottom-nav">
            <a href="accueil.html" class="nav-item active">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>Accueil</span>
            </a>
            <a href="#" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <span>Découvrir</span>
            </a>
            <a href="importer.html" class="nav-item">
                <div class="btn-publish">+</div>
                <span style="margin-top: 2px;">Publier</span>
            </a>
            <a href="chat.html" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
                <span>Messages</span>
            </a>
            <a href="profil.html" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span>Profil</span>
            </a>
        </nav>
    </div>

    <script>
        const likeBtn = document.getElementById('likeBtn');
        let isLiked = false;
        likeBtn.addEventListener('click', function() {
            isLiked = !isLiked;
            this.style.color = isLiked ? "#e50914" : "#ffffff";
            this.querySelector('.icon-circle').style.backgroundColor = isLiked ? "rgba(229, 9, 20, 0.2)" : "rgba(30, 30, 30, 0.4)";
            this.querySelector('.icon-svg').style.fill = isLiked ? "#e50914" : "#ffffff";
