<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ChatBook</title>
<link rel="stylesheet" href="css/style.css">
</head><body>
<div class="header"><div class="logo"><span>Chat</span>Book</div>
<div class="search">🔍 <input placeholder="Rechercher" oninput="doSearch(this.value)"></div>
<div class="cats"><button class="cat active" onclick="fil('tous',this)">Tous</button><button class="cat" onclick="fil('humour',this)">😂 Humour</button><button class="cat" onclick="fil('motivation',this)">💪 Motivation</button><button class="cat" onclick="fil('musique',this)">🎵 Musique</button></div></div>
<div class="feed" id="feed"></div>
<div class="bottom"><button class="nav active">Accueil</button><button class="nav" onclick="document.getElementById('up').click()">Publier</button><button class="nav" onclick="location.href='inscription.html'">Profil</button></div>
<input type="file" id="up" accept="video/*" style="display:none" onchange="addV(this)">
<script>
let data=[
 {url:"https://www.w3schools.com/html/mov_bbb.mp4",user:"@dakar_comedy",cat:"humour",likes:12300,desc:"Trop drôle 😂",coms:[]},
 {url:"https://www.w3schools.com/html/movie.mp4",user:"@motivation_sn",cat:"motivation",likes:45000,desc:"N'abandonne jamais 💪",coms:[]},
];
let saved=new Set();
function render(arr){
 let f=document.getElementById('feed');f.innerHTML="";
 arr.forEach((v,i)=>{
  f.innerHTML+=`<div class="box">
   <video src="${v.url}" loop muted playsinline id="vid${i}" onclick="this.paused?this.play():this.pause()"></video>
   <div class="info"><b>${v.user}</b><p>${v.desc}</p></div>
   <div class="actions">
     <div class="act" id="like${i}" onclick="like(${i})"><div class="icon">🤍</div><span id="lc${i}">${format(v.likes)}</span></div>
     <div class="act" onclick="openCom(${i})"><div class="icon">💬</div><span id="cnum${i}">${v.coms.length}</span></div>
     <div class="act" id="save${i}" onclick="saveV(${i})"><div class="icon">☆</div><span>Favoris</span></div>
     <div class="act" onclick="shareV(${i})"><div class="icon">↗️</div><span>Partage</span></div>
     <div class="act" onclick="togSound(${i})"><div class="icon" id="s${i}">🔇</div><span>Son</span></div>
   </div>
  </div>`;
 });
}
function format(n){return n>=1000?(n/1000).toFixed(1)+'k':n}
function togSound(i){let v=document.getElementById('vid'+i);v.muted=!v.muted;document.getElementById('s'+i).textContent=v.muted?'🔇':'🔊';}
function like(i){let el=document.getElementById('like'+i);let ic=el.querySelector('.icon');let lc=document.getElementById('lc'+i);if(el.classList.contains('liked')){el.classList.remove('liked');ic.textContent='🤍';data[i].likes--;}else{el.classList.add('liked');ic.textContent='❤️';data[i].likes++;}lc.textContent=format(data[i].likes);}
function saveV(i){let el=document.getElementById('save'+i);let ic=el.querySelector('.icon');if(saved.has(i)){saved.delete(i);el.classList.remove('saved');ic.textContent='☆';}else{saved.add(i);el.classList.add('saved');ic.textContent='★';}}
function openCom(i){let t=prompt('Ajouter un commentaire:');if(t){data[i].coms.push(t);document.getElementById('cnum'+i).textContent=data[i].coms.length;}}
function shareV(i){if(navigator.share){navigator.share({text:data[i].desc,url:location.href});}else{alert('Lien copié!');}}
function fil(c,b){document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(c=='tous')render(data);else render(data.filter(d=>d.cat==c));}
function doSearch(q){q=q.toLowerCase();render(data.filter(d=>d.user.toLowerCase().includes(q)||d.desc.toLowerCase().includes(q)));}
function addV(inp){let f=inp.files[0];if(!f)return;let u=URL.createObjectURL(f);data.unshift({url:u,user:"@moi",cat:"tous",likes:0,desc:"Ma vidéo",coms:[]});render(data);}
render(data);
</script></body></html>
