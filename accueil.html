<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatBook - Accueil</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;height:100vh;display:flex;flex-direction:column}
.header{padding:12px;background:#000}
.logo{font-size:22px;font-weight:900}.logo span{color:#fe2c55}
.search{background:#1e1e1e;border-radius:25px;padding:10px 14px;margin-top:10px}
.search input{background:transparent;border:none;color:#fff;width:100%;outline:none}
.cats{display:flex;gap:8px;margin-top:10px}
.cat{padding:7px 14px;border-radius:20px;background:#2a2a2a;border:none;color:#fff;cursor:pointer}.cat.active{background:#fe2c55}
.feed{flex:1;overflow-y:auto;background:#000}
.box{position:relative;width:100%;height:75vh;background:#111;margin-bottom:2px;display:flex;align-items:center;justify-content:center}
.box video{width:100%;height:100%;object-fit:cover}
.info{position:absolute;left:10px;bottom:10px;z-index:2}
.sound{position:absolute;top:10px;right:10px;z-index:3;background:rgba(0,0,0,0.6);border:none;color:#fff;width:36px;height:36px;border-radius:50%}
.like{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:15px;text-align:center}
.like div{width:42px;height:42px;background:rgba(255,255,255,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center}
.bottom{height:55px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center}
.nav{color:#777;background:none;border:none;font-size:10px}.nav.active{color:#fff}
</style>
</head>
<body>
<div class="header">
  <div class="logo"><span>Chat</span>Book</div>
  <div class="search">🔍 <input placeholder="Rechercher..." oninput="search(this.value)"></div>
  <div class="cats">
    <button class="cat active" onclick="filterCat('tous',this)">Tous</button>
    <button class="cat" onclick="filterCat('humour',this)">😂 Humour</button>
    <button class="cat" onclick="filterCat('motivation',this)">💪 Motivation</button>
    <button class="cat" onclick="filterCat('musique',this)">🎵 Musique</button>
  </div>
</div>

<div class="feed" id="feed"></div>

<div class="bottom">
  <button class="nav active">Accueil</button>
  <button class="nav" onclick="document.getElementById('file').click()">Publier</button>
  <button class="nav" onclick="location.href='index.html'">Profil</button>
</div>
<input type="file" id="file" accept="video/*" style="display:none" onchange="newVid(this)">

<script>
let list=[
 {url:"https://www.w3schools.com/html/mov_bbb.mp4",user:"@dakar_comedy",cat:"humour",likes:"12.3k",desc:"Quand tu dis que t'as pas d'argent 😂"},
 {url:"https://www.w3schools.com/html/movie.mp4",user:"@motivation_sn",cat:"motivation",likes:"45k",desc:"Ne lâche jamais 💪"},
 {url:"https://www.w3schools.com/html/mov_bbb.mp4",user:"@sabar_dance",cat:"musique",likes:"89k",desc:"Nouveau son 🔥"},
];
let feed=document.getElementById('feed');
function render(arr){
 feed.innerHTML="";
 arr.forEach((v,i)=>{
  feed.innerHTML+=<div class="box"><video src="${v.url}" loop playsinline autoplay muted id="v${i}" onclick="if(this.paused)this.play();else this.pause()"></video><button class="sound" onclick="let vid=document.getElementById('v${i}');vid.muted=!vid.muted;this.textContent=vid.muted?'🔇':'🔊'">🔇</button><div class="info"><b>${v.user}</b><br><small>${v.desc}</small></div><div class="like"><div>❤️</div><small>${v.likes}</small></div></div>;
 });
}
function filterCat(c,b){document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(c=='tous')render(list);else render(list.filter(v=>v.cat==c));}
function search(q){render(list.filter(v=>v.user.includes(q)||v.desc.includes(q)));}
function newVid(inp){let f=inp.files[0];if(!f)return;let u=URL.createObjectURL(f);list.unshift({url:u,user:"@moi",cat:"tous",likes:"0",desc:"Ma vidéo"});render(list);}
render(list);
</script>
</body>
</html>
