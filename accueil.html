<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBook - Pour vous</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #050505;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            background-color: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #1a1a1a;
            border-right: 1px solid #1a1a1a;
            box-sizing: border-box;
            box-shadow: 0 0 30px rgba(229, 9, 20, 0.1);
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #000000;
            border-bottom: 1px solid #111;
        }

        .logo {
            color: #e50914;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-tabs {
            font-size: 14px;
            color: #777777;
        }

        .nav-tabs span {
            cursor: pointer;
            padding: 5px 10px;
        }

        .nav-tabs .active {
            color: #ffffff;
            font-weight: bold;
            border-bottom: 2px solid #e50914;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 9/16;
            background-color: #0a0a0a;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-details {
            padding: 15px;
            background-color: #000000;
        }

        .author {
            font-weight: bold;
            font-size: 16px;
            color: #ffffff;
            margin-bottom: 5px;
        }

        .description {
            font-size: 14px;
            color: #cccccc;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .hashtag {
            color: #e50914;
            font-weight: 500;
        }

        .action-bar {
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #111;
            border-bottom: 1px solid #111;
            background-color: #050505;
        }

        .action-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff; /* Boutons blancs par défaut */
            font-size: 14px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px 10px;
            border-radius: 20px;
            transition: color 0.2s, background-color 0.2s;
        }

        .action-item:hover {
            background-color: #111111;
        }

        /* Classe active pour passer en rouge au clic */
        .action-item.clicked {
            color: #e50914 !important;
        }

        .comments-section {
            padding: 15px;
            flex: 1;
        }

        .comments-title {
            font-size: 14px;
            color: #777777;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .comment-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .comment-item {
            font-size: 14px;
            line-height: 1.4;
        }

        .comment-user {
            font-weight: bold;
            color: #ffffff;
            margin-right: 5px;
        }

        .comment-text {
            color: #bbbbbb;
        }

        .comment-box {
            display: flex;
            gap: 10px;
            padding: 10px 0;
        }

        .comment-box input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #222222;
            border-radius: 25px;
            background-color: #111111;
            color: #ffffff;
            font-size: 14px;
        }

        .comment-box input:focus {
            outline: none;
            border-color: #e50914;
        }

        .btn-publish {
            background-color: #e50914;
            color: #ffffff;
            border: none;
            padding: 0 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-publish:hover {
            background-color: #b80710;
        }

        .ads-footer {
            text-align: center;
            padding: 15px;
            font-size: 11px;
            color: #444444;
            letter-spacing: 1px;
            border-top: 1px solid #111;
            background-color: #000000;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <a href="index.html" class="logo">ChatBook</a>
            <div class="nav-tabs">
                <span>Abonnements</span>
                <span class="active">Pour vous</span>
            </div>
        </header>

        <div class="video-wrapper">
            <video autoplay loop muted playsinline>
                <source src="https://mixkit.co" type="video/mp4">
                Votre navigateur ne supporte pas les vidéos.
            </video>
        </div>

        <div class="video-details">
            <div class="author">@NagnoumaDeveloper</div>
            <div class="description">
                Bienvenue sur le flux vidéo officiel de ChatBook ! 🚀✨ 🔥 <span class="hashtag">#tech</span>
            </div>
        </div>

        <!-- Barre d'actions avec boutons interactifs -->
        <div class="action-bar">
            <button class="action-item" id="likeBtn">❤️ <span id="likeCount">12.5K</span></button>
            <button class="action-item" id="favBtn">⭐ <span>Favoris</span></button>
            <button class="action-item">🔗 <span>Partager</span></button>
        </div>

        <div class="comments-section">
            <div class="comments-title">Commentaires</div>
            
            <!-- Liste vide (utilisateurs 1 et 2 supprimés) -->
            <div class="comment-list" id="commentList"></div>

            <form class="comment-box" id="commentForm">
                <input type="text" id="commentInput" placeholder="Ajouter un commentaire..." autocomplete="off" required>
                <button type="submit" class="btn-publish">Publier</button>
            </form>
        </div>

        <footer class="ads-footer">
            ANNONCE PUBLICITAIRE • ESPACE ADMOB / FACEBOOK ADS
        </footer>
    </div>

    <script>
        // Gestion du bouton Like (Cœur)
        const likeBtn = document.getElementById('likeBtn');
        let isLiked = false;
        likeBtn.addEventListener('click', function() {
            isLiked = !isLiked;
            if(isLiked) {
                this.classList.add('clicked');
                document.getElementById('likeCount').textContent = "12.6K";
            } else {
                this.classList.remove('clicked');
                document.getElementById('likeCount').textContent = "12.5K";
            }
        });

        // Gestion du bouton Favoris (Étoile)
        const favBtn = document.getElementById('favBtn');
        let isFav = false;
        favBtn.addEventListener('click', function() {
            isFav = !isFav;
            if(isFav) {
                this.classList.add('clicked');
            } else {
                this.classList.remove('clicked');
            }
        });

        // Ajout dynamique des commentaires
        const commentForm = document.getElementById('commentForm');
        const commentInput = document.getElementById('commentInput');
        const commentList = document.getElementById('commentList');

        commentForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newComment = document.createElement('div');
            newComment.classList.add('comment-item');
            newComment.innerHTML = `
                <span class="comment-user">@Moi:</span>
                <span class="comment-text">${commentInput.value}</span>
            `;
            
            commentList.appendChild(newComment);
            commentInput.value = '';
        });
    </script>
</body>
</html>
