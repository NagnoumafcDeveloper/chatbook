<script>
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_DucLDxgJL-poE8KrN_9bnA_K-D0a34b2259be265f247dcbfce76ca80630b9ee7";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function chargerVideos() {
            const container = document.getElementById('feedContainer');
            
            const { data: listVideos, error } = await supabaseClient
                .from('videos')
                .select('*');

            if (error || !listVideos || listVideos.length === 0) {
                container.innerHTML = '<div class="no-video">Aucune vidéo disponible. Cliquez sur "Publier" pour ajouter la première !</div>';
                return;
            }

            container.innerHTML = '';

            listVideos.forEach((vid, index) => {
                const section = document.createElement('section');
                section.className = 'video-section';
                
                section.innerHTML = `
                    <div class="video-wrapper">
                        <video loop muted ${index === 0 ? 'autoplay' : ''} playsinline>
                            <source src="${vid.url_video}" type="video/mp4">
                        </video>
                    </div>
                    <div class="side-actions">
                        <div class="action-button">
                            <div class="icon-circle"><svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>
                            <span>1,2 K</span>
                        </div>
                        <div class="action-button">
                            <div class="icon-circle"><svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
                            <span>128</span>
                        </div>
                    </div>
                    <div class="video-details">
                        <div class="author">@${vid.auteur || 'Auteur'}</div>
                        <div class="description">${vid.description || ''}</div>
                    </div>
                `;
                container.appendChild(section);
            });

            const videos = container.querySelectorAll('video');
            
            // Correction de la gestion du scroll pour jouer/mettre en pause la vidéo active
            container.addEventListener('scroll', () => {
                videos.forEach(video => {
                    const rect = video.getBoundingClientRect();
                    // Si la vidéo est visible à l'écran, on la lit, sinon on la met en pause
                    if (rect.top >= -window.innerHeight / 2 && rect.top < window.innerHeight / 2) {
                        video.play().catch(() => {});
                    } else {
                        video.pause();
                    }
                });
            });
        }

        // Lancer le chargement des vidéos au démarrage
        chargerVideos();
    </script>
