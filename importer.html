<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBook - Importer une vidéo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #000000 0%, #1a0002 50%, #4a0005 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #ffffff;
        }

        .upload-container {
            background-color: #111111;
            width: 90%;
            max-width: 400px;
            padding: 30px 25px;
            border-radius: 20px;
            border: 1px solid #222222;
            box-shadow: 0 10px 30px rgba(229, 9, 20, 0.15);
            text-align: center;
            box-sizing: border-box;
            position: relative;
        }

        /* Bouton Retour en haut à gauche */
        .btn-back {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #222222;
            border: none;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-back:hover {
            background-color: #333333;
        }

        h1 {
            color: #e50914;
            font-size: 26px;
            font-weight: bold;
            margin: 25px 0 10px 0;
            letter-spacing: 1px;
        }

        p {
            color: #aaaaaa;
            font-size: 14px;
            margin: 0 0 25px 0;
        }

        /* Zone de dépôt/sélection stylisée */
        .drop-zone {
            border: 2px dashed #e50914;
            border-radius: 12px;
            padding: 40px 20px;
            background-color: #1a1a1a;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 20px;
        }

        .drop-zone:hover {
            background-color: #222222;
        }

        .upload-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            color: #aaaaaa;
            margin-bottom: 6px;
            padding-left: 5px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #333333;
            border-radius: 8px;
            background-color: #1a1a1a;
            color: #ffffff;
            box-sizing: border-box;
            font-size: 14px;
            font-family: inherit;
        }

        textarea {
            resize: none;
            height: 80px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #e50914;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: #e50914;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #b80710;
        }

        /* Masquer l'input de fichier natif */
        #fileInput {
            display: none;
        }

        .file-name-display {
            font-size: 13px;
            color: #42b72a;
            margin-top: 8px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="upload-container">
    <!-- Bouton de retour à la page des vidéos -->
    <a href="accueil.html" class="btn-back">◀️ Retour</a>

    <h1>Créer un post</h1>
    <p>Publiez une vidéo verticale sur ChatBook</p>
    
    <form id="uploadForm">
        <!-- Zone de sélection de fichier -->
        <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">🎬</div>
            <div style="font-weight: bold; font-size: 15px;">Sélectionner une vidéo</div>
            <div style="color: #666; font-size: 12px; margin-top: 4px;">Format MP4 recommandé</div>
            <div class="file-name-display" id="fileName">Aucun fichier choisi</div>
            <input type="file" id="fileInput" accept="video/*" required>
        </div>

        <!-- Légende / Description -->
        <div class="input-group">
            <label for="description">Légende</label>
            <textarea id="description" placeholder="Ajoutez une description et des #hashtags..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">Publier la vidéo</button>
    </form>
</div>

<script>
    // Afficher le nom du fichier sélectionné
    const fileInput = document.getElementById('fileInput');
    const fileNameDisplay = document.getElementById('fileName');

    fileInput.addEventListener('change', function() {
        if (this.files && this.files.length > 0) {
            fileNameDisplay.textContent = "✓ " + this.files[0].name;
            fileNameDisplay.style.color = "#42b72a";
        } else {
            fileNameDisplay.textContent = "Aucun fichier choisi";
            fileNameDisplay.style.color = "#666";
        }
    });

    // Gestion de la publication (simulation)
    document.getElementById('uploadForm').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('Vidéo importée avec succès ! (Simulation)');
        window.location.href = 'accueil.html';
    });
</script>

</body>
</html>
