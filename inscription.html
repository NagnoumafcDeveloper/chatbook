<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatBook - Inscription</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f0f2f5;display:flex;justify-content:center;align-items:center;height:100vh}
.card{background:#fff;width:90%;max-width:360px;padding:22px;border-radius:20px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,0.1)}
h1{color:#0a7cff;font-size:30px;font-weight:800}.sub{color:#555;font-size:13px;margin:8px 0 18px}
.input-box{position:relative;margin-bottom:12px}
.input-box input{width:100%;padding:12px 40px 12px 12px;border:none;background:#f1f5f9;border-radius:20px;outline:none}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px}
.btn{width:100%;padding:12px;background:#22c55e;color:#fff;border:none;border-radius:20px;font-weight:bold;font-size:15px;cursor:pointer;margin-top:8px}
.msg{margin-top:10px;font-size:13px;padding:8px;border-radius:10px;display:none}
.msg.ok{display:block;background:#dcfce7;color:#166534}.msg.err{display:block;background:#fee2e2;color:#991b1b}
a{color:#0a7cff;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<div class="card">
  <h1>ChatBook</h1>
  <div class="sub">Crée ton compte pour voir le feed</div>
  <div class="input-box"><input id="name" placeholder="Nom complet"></div>
  <div class="input-box"><input id="email" placeholder="Email" type="email"></div>
  <div class="input-box">
    <input id="pass" placeholder="Mot de passe" type="password">
    <button class="eye" type="button" onclick="togglePass()">👁️</button>
  </div>
  <div id="m" class="msg"></div>
  <button class="btn" onclick="inscrire()">S'inscrire</button>
  <div style="margin-top:12px"><a href="connexion.html">Déjà un compte? Se connecter</a></div>
</div>
<script>
function togglePass(){
  let p=document.getElementById('pass');
  let e=document.querySelector('.eye');
  if(p.type==='password'){p.type='text';e.textContent='🙈';}
  else{p.type='password';e.textContent='👁️';}
}
function inscrire(){
  let n=document.getElementById('name').value.trim();
  let e=document.getElementById('email').value.trim();
  let p=document.getElementById('pass').value.trim();
  let m=document.getElementById('m');
  if(!n||!e||!p){m.textContent='Remplis tous les champs';m.className='msg err';return;}
  m.textContent='✅ Compte créé! Redirection...';m.className='msg ok';
  setTimeout(()=>{location.href='accueil.html';},1200);
}
</script>
</body>
</html>
