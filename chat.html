<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ChatBook - Vidéos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .video-container {
            width: 100%;
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }

        .video-container::-webkit-scrollbar {
            display: none;
        }

        .video-player-box {
            position: relative;
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Fonds stylisés générés directement en code (zéro chargement externe) */
        .bg-gradient-1 {
            background: linear-gradient(45deg, #ff007f, #7f00ff, #0000ff);
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0.6;
        }

        .bg-gradient-2 {
            background: linear-gradient(135deg, #00f2fe, #4facfe, #000000);
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0.6;
        }

        /* Message central pour simuler le chargement d'un média */
        .media-placeholder-text {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
            z-index: 2;
            opacity: 0.8;
            text-align: center;
            padding: 20px;
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
        }

        .top-nav {
            position: absolute;
            top: 25px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 10;
        }

        .top-nav .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1877f2;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
        }

        .top-nav .tabs {
            display: flex;
            gap: 15px;
        }

        .top-nav .tabs span {
            font-size: 1rem;
            font-weight: bold;
            opacity: 0.5;
            cursor: pointer;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .top-nav .tabs span.active {
            opacity: 1;
            border-bottom: 2px solid #ffffff;
            padding-bottom: 2px;
        }

        .video-sidebar-left {
            position: absolute;
            bottom: 40px;
            left: 15px;
            z-index: 10;
            max-width: 75%;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
        }

        .video-sidebar-left .username {
            font-weight: bold;
            font-size: 1.05rem;
            margin-bottom: 8px;
        }

        .video-sidebar-left .description {
            font-size: 0.95rem;
            line-height: 1.3;
        }

        .video-sidebar-right {
            position: absolute;
            bottom: 60px;
            right: 15px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .action-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .icon-button {
            width: 45px;
            height: 45px;
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            margin-bottom: 5px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.1s;
        }

        .icon-button.liked {
            background-color: rgba(254, 44, 85, 0.3);
            border-color: #fe2c55;
        }

        .action-icon span {
            font-size: 0.75rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Barre supérieure -->
    <div class="top-nav">
        <div class="logo">ChatBook</div>
        <div class="tabs">
            <span id="tab-abonnement" onclick="switchTab('abonnement')">Abonnements</span>
            <span id="tab-pourvous" class="active" onclick="switchTab('pourvous')">Pour vous</span>
        </div>
    </div>

    <div class="video-container">

        <!-- FLUX 1 -->
        <div class="video-player-box">
            <div class="bg-gradient-1"></div>
            <div class="media-placeholder-text">📹 Vidéo en cours...</div>
            
            <div class="video-sidebar-left">
                <div class="username">@NagnoumaDeveloper</div>
                <div class="description">Lancement officiel mondial de l'interface vidéo ChatBook ! 🚀🔥 #tech #futur</div>
            </div>
            <div class="video-sidebar-right">
                <div class="action-icon" onclick="toggleLike(this)">
                    <div class="icon-button">🤍</div>
                    <span>12500</span>
                </div>
                <div class="action-icon">
                    <div class="icon-button">💬</div>
                    <span>845</span>
                </div>
            </div>
        </div>

        <!-- FLUX 2 -->
        <div class="video-player-box">
            <div class="bg-gradient-2"></div>
            <div class="media-placeholder-text">⚡ En direct du réseau</div>
            
            <div class="video-sidebar-left">
                <div class="username">@GuineeTech</div>
                <div class="description">Créer une application de classe mondiale depuis sa chambre. Tout est possible. 🌐💡</div>
            </div>
            <div class="video-sidebar-right">
                <div class="action-icon" onclick="toggleLike(this)">
                    <div class="icon-button">🤍</div>
                    <span>45200</span>
                </div>
                <div class="action-icon">
                    <div class="icon-button">💬</div>
                    <span>2.1K</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Gestion des onglets
        function switchTab(tabName) {
            const tabAbonnement = document.getElementById('tab-abonnement');
            const tabPourvous = document.getElementById('tab-pourvous');
            
            if (tabName === 'abonnement') {
                tabAbonnement.classList.add('active');
                tabPourvous.classList.remove('active');
                alert("Flux d'abonnements bientôt disponible ! 🚀");
            } else {
                tabPourvous.classList.add('active');
                tabAbonnement.classList.remove('active');
            }
        }

        // Gestion des Likes
        function toggleLike(element) {
            const iconDiv = element.querySelector('.icon-button');
            const countSpan = element.querySelector('span');
            let currentCount = parseInt(countSpan.innerText);

            if (iconDiv.classList.contains('liked')) {
                iconDiv.classList.remove('liked');
                iconDiv.innerText = '🤍';
                countSpan.innerText = currentCount - 1;
            } else {
                iconDiv.classList.add('liked');
                iconDiv.innerText = '❤️';
                countSpan.innerText = currentCount + 1;
            }
        }
    </script>
</body>
</html>
