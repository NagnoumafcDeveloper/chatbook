```html
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBook</title>
    <style>
      body {
          margin: 0;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          background-color: #000;
          color: #fff;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          overflow: hidden;
      }
      .video-container {
          position: relative;
          width: 100%;
          max-width: 414px;
          height: 100vh;
          background-color: #121212;
          display: flex;
          justify-content: center;
          align-items: center;
      }
      .header-text {
          position: absolute;
          top: 20px;
          left: 20px;
          font-size: 24px;
          font-weight: bold;
          z-index: 20;
          text-shadow: 0 2px 4px rgba(0,0,0,0.8);
          color: #fff;
      }
      .sidebar {
          position: absolute;
          right: 15px;
          bottom: 100px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 20px;
          z-index: 10;
      }
      .action-item {
          display: flex;
          flex-direction: column;
          align-items: center;
          color: #fff;
          cursor: pointer;
      }
      .action-item span {
          font-size: 12px;
          margin-top: 5px;
          text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      }
      .icon {
          width: 40px;
          height: 40px;
          display: flex;
          justify-content: center;
          align-items: center;
          font-size: 26px;
          transition: transform 0.2s ease;
      }
      .icon:active {
          transform: scale(1.2);
      }
      .follow-btn {
          width: 22px;
          height: 22px;
          background-color: #fe2c55;
          border-radius: 50%;
          display: flex;
          justify-content: center;
          align-items: center;
          color: #fff;
          font-size: 13px;
          font-weight: bold;
          cursor: pointer;
          position: absolute;
          bottom: -6px;
          left: 50%;
          transform: translateX(-50%);
      }
      .action-wrapper {
          position: relative;
          margin-bottom: 10px;
      }
      .follow-btn.followed {
          display: none;
      }
      .like-icon {
          color: #fff;
          transition: color 0.2s;
      }
      .like-icon.active {
          color: #fe2c55;
      }
      .favoris-icon.active {
          color: #ffcc00;
          text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
      }
      .modal {
          position: absolute;
          bottom: -100%;
          left: 0;
          width: 100%;
          height: 60vh;
          background: #1e1e1e;
          border-top-left-radius: 20px;
          border-top-right-radius: 20px;
          display: flex;
          flex-direction: column;
          transition: bottom 0.3s ease-in-out;
          z-index: 100;
      }
      .modal.active {
          bottom: 0;
      }
      .modal-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 15px 20px;
          border-bottom: 1px solid #333;
          font-size: 15px;
          font-weight: bold;
      }
      .close-btn {
          cursor: pointer;
          font-size: 18px;
          color: #aaa;
      }
      .comments-list {
          flex: 1;
          overflow-y: auto;
          padding: 15px;
          display: flex;
          flex-direction: column;
          gap: 12px;
      }
      .comment-item {
          background: #2a2a2a;
          padding: 10px 14px;
          border-radius: 12px;
          font-size: 14px;
          color: #e1e1e1;
      }
      .comment-input {
          display: flex;
          padding: 12px 15px;
          background: #181818;
          border-top: 1px solid #333;
          gap: 10px;
      }
      .comment-input input {
          flex: 1;
          border: none;
          background: #2a2a2a;
          color: #fff;
          padding: 10px 15px;
          border-radius: 20px;
          outline: none;
          font-size: 14px;
      }
      .comment-input button {
          border: none;
          background: #fe2c55;
          color: #fff;
          padding: 0 18px;
          border-radius: 20px;
          cursor: pointer;
          font-weight: bold;
          font-size: 14px;
      }
    </style>
</head>
<body>

<div class="video-container">
   <div class="header-text">Motivation, Humour & Enfant</div>

   <div class="sidebar">
       <div class="action-wrapper" onclick="toggleFollow()">
           <div class="icon">👤</div>
           <div class="follow-btn" id="followBtn">+</div>
       </div>

       <div class="action-item" onclick="toggleLike()">
           <div class="icon like-icon" id="likeIcon">❤️</div>
           <span>J'aime</span>
       </div>

       <div class="action-item" onclick="openComments()">
           <div class="icon">💬</div>
           <span id="commentCount">0</span>
       </div>

       <div class="action-item" onclick="toggleFavorite()">
           <div class="icon favoris-icon" id="favorisIcon">⭐</div>
           <span>Favoris</span>
       </div>

       <div class="action-item" onclick="shareVideo()">
           <div class="icon">↗️</div>
           <span>Partager</span>
       </div>
   </div>
</div>

<div class="modal" id="commentModal">
    <div class="modal-header">
        <span id="commentHeaderCount">0 commentaire</span>
        <span class="close-btn" onclick="closeComments()">✕</span>
    </div>
    <div class="comments-list" id="commentsList"></div>
    <div class="comment-input">
        <input type="text" id="commentTextInput" placeholder="Ajouter un commentaire...">
        <button onclick="addComment()">Publier</button>
    </div>
</div>

<script>
    function toggleFollow() {
        const btn = document.getElementById("followBtn");
        btn.classList.add("followed");
    }

    function toggleLike() {
        const icon = document.getElementById("likeIcon");
        icon.classList.toggle("active");
    }

    function toggleFavorite() {
        const icon = document.getElementById("favorisIcon");
        icon.classList.toggle("active");
    }

    function shareVideo() {
        alert("Lien copié dans le presse-papier !");
    }

    function openComments() {
        document.getElementById("commentModal").classList.add("active");
    }

    function closeComments() {
        document.getElementById("commentModal").classList.remove("active");
    }

    function addComment() {
        const input = document.getElementById("commentTextInput");
        const text = input.value.trim();
        if (text !== "") {
            const list = document.getElementById("commentsList");
            const newComment = document.createElement("div");
            newComment.className = "comment-item";
            newComment.innerText = text;
            list.appendChild(newComment);
            input.value = "";
            updateCounts();
        }
    }

    function updateCounts() {
        const list = document.getElementById("commentsList");
        const count = list.children.length;
        document.getElementById("commentCount").innerText = count;
        document.getElementById("commentHeaderCount").innerText = count + (count > 1 ? " commentaires" : " commentaire");
    }
</script>

</body>
</html>
