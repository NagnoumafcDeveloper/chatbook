<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBook - Vidéos</title>
</head>
<body>

    <h1>Liste des vidéos</h1>
    
    <!-- Conteneur où les vidéos de Supabase vont s'afficher -->
    <div id="videos-container">
        <p>@Chargement...</p>
    </div>

    <!-- Script JavaScript avec Supabase -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

        // Remplacez par vos vraies clés Supabase (Project URL et Anon Key)
        const SUPABASE_URL = 'VOTRE_SUPABASE_URL'
        const SUPABASE_ANON_KEY = 'VOTRE_SUPABASE_ANON_KEY'

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

        async function chargerVideos() {
            const container = document.getElementById('videos-container')

            // Récupération des données de votre table "videos" visible dans Supabase
            const { data: videos, error } = await supabase
                .from('videos')
                .select('*')
                .order('created_at', { ascending: false })

            if (error) {
                console.error('Erreur lors du chargement des vidéos :', error)
                container.innerHTML = '<p>Erreur de chargement des vidéos.</p>'
                return
            }

            if (!videos || videos.length === 0) {
                container.innerHTML = '<p>Aucune vidéo trouvée.</p>'
                return
            }

            // Vider le conteneur avant d'afficher
            container.innerHTML = ''

            // Affichage dynamique basé sur vos colonnes (titre, categorie, auteur)
            videos.forEach((video) => {
                const videoCard = document.createElement('div')
                videoCard.style.cssText = 'margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 8px;'

                videoCard.innerHTML = `
                    <h3>${video.titre}</h3>
                    <p><strong>Catégorie :</strong> ${video.categorie}</p>
                    <p><strong>Auteur :</strong> ${video.auteur}</p>
                    <small>Ajouté le : ${new Date(video.created_at).toLocaleString()}</small>
                    
                    <div class="video-actions" style="margin-top: 10px; display: flex; gap: 15px;">
                        <button class="btn-like">❤️ J'aime (<span class="like-count">0</span>)</button>
                        <button class="btn-comment">💬 Commentaire</button>
                        <button class="btn-share">↗️ Partager</button>
                    </div>
                `

                // Gestion simple des boutons d'interaction locaux
                const likeBtn = videoCard.querySelector('.btn-like')
                const countSpan = videoCard.querySelector('.like-count')
                likeBtn.addEventListener('click', () => {
                    countSpan.textContent = parseInt(countSpan.textContent) + 1
                    likeBtn.style.color = 'red'
                })

                videoCard.querySelector('.btn-comment').addEventListener('click', () => {
                    const com = prompt('Votre commentaire :')
                    if (com) alert('Commentaire enregistré localement !')
                })

                videoCard.querySelector('.btn-share').addEventListener('click', () => {
                    navigator.clipboard.writeText(window.location.href)
                    alert('Lien copié !')
                })

                container.appendChild(videoCard)
            })
        }

        chargerVideos()
    </script>
</body>
</html>
