<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBook</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #4a154b, #2b1055);
            overflow: hidden;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
        }
        .categories {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .category-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .category-btn.active, .category-btn:hover {
            background: white;
            color: #2b1055;
        }
        .main-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 75vh;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .sidebar {
            position: absolute;
            right: 15px;
            bottom: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .action-btn {
            background: rgba(0, 0, 0, 0.5);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.2s;
        }
        .action-btn:hover {
            transform: scale(1.1);
        }
        .action-btn span {
            font-size: 12px;
            margin-top: 2px;
        }
        .video-info {
            position: absolute;
            left: 15px;
            bottom: 20px;
            max-width: 75%;
        }
        .video-info h3 {
            font-size: 16px;
            color: #00ffcc;
            margin-bottom: 5px;
        }
        .video-info p {
            font-size: 14px;
            color: #ddd;
        }
    </style>
</head>
<body>

    <header>ChatBook</header>

    <!-- Catégories -->
    <div class="categories">
        <button class="category-btn active" onclick="filterCategory('humour')">😄 Humour</button>
        <button class="category-btn" onclick="filterCategory('motivation')">💪 Motivation</button>
        <button class="category-btn" onclick="filterCategory('enfants')">👶 Enfants</button>
    </div>

    <!-- Conteneur Principal de la Vidéo -->
    <div class="main-container">
        <!-- Élément Vidéo -->
        <video id="videoPlayer" src="" controls autoplay muted loop></video>

        <!-- Boutons d'interaction à droite (Likes, Commentaires, Partage) -->
        <div class="sidebar">
            <button class="action-btn" id="likeBtn" onclick="toggleLike()">
                ❤️ <span id="likeCount">12.5K</span>
            </button>
            <button class="action-btn" onclick="openComments()">
                💬 <span id="commentCount">2</span>
            </button>
            <button class="action-btn" onclick="shareVideo()">
                🔗 <span>Partager</span>
            </button>
        </div>

        <!-- Informations de la vidéo (Auteur et Description) -->
        <div class="video-info">
            <h3 id="videoAuthor">@NagnoumaDeveloper</h3>
            <p id="videoDesc">Préparez-vous à rire ! Les meilleures vidéos d'humour positives sont ici. 🤣 ✨ #détente</p>
        </div>
    </div>

    <script>
        // Exemple de base de données de vidéos
        const videos = [
            {
                category: 'humour',
                url: 'https://www.w3schools.com/html/mov_bbb.mp4',
                author: '@NagnoumaDeveloper',
                desc: 'Préparez-vous à rire ! Les meilleures vidéos d\'humour positives sont ici. 🤣 ✨ #détente',
                likes: 12500,
                comments: 2,
                liked: false
            },
            {
                category: 'motivation',
                url: 'https://www.w3schools.com/html/movie.mp4',
                author: '@MotivationDaily',
                desc: 'Ne lâchez rien, chaque petit effort compte pour réussir vos projets ! 🚀',
                likes: 8400,
                comments: 45,
                liked: false
            }
        ];

        let currentIndex = 0;

        function loadVideo(index) {
            const currentVideo = videos[index];
            const player = document.getElementById('videoPlayer');
            
            player.src = currentVideo.url;
            document.getElementById('videoAuthor').innerText = currentVideo.author;
            document.getElementById('videoDesc').innerText = currentVideo.desc;
            document.getElementById('likeCount').innerText = formatNumber(currentVideo.likes);
            document.getElementById('commentCount').innerText = currentVideo.comments;
            
            // État du bouton Like
            const likeBtn = document.getElementById('likeBtn');
            if (currentVideo.liked) {
                likeBtn.style.color = '#ff4d4d';
            } else {
                likeBtn.style.color = 'white';
            }
            
            player.play().catch(e => console.log("Lecture automatique bloquée par le navigateur :", e));
        }

        function toggleLike() {
            const currentVideo = videos[currentIndex];
            if (!currentVideo.liked) {
                currentVideo.likes++;
                currentVideo.liked = true;
                document.getElementById('likeBtn').style.color = '#ff4d4d';
            } else {
                currentVideo.likes--;
                currentVideo.liked = false;
                document.getElementById('likeBtn').style.color = 'white';
            }
            document.getElementById('likeCount').innerText = formatNumber(currentVideo.likes);
        }

        function openComments() {
            alert("Espace commentaires : Vous pouvez ajouter ici l'ouverture de votre panneau de commentaires !");
        }

        function shareVideo() {
            if (navigator.share) {
                navigator.share({
                    title: 'ChatBook Video',
                    url: window.location.href
                }).catch(console.error);
            } else {
                alert("Lien copié dans le presse-papier !");
            }
        }

        function filterCategory(category) {
            // Logique de filtrage par catégorie
            const foundIndex = videos.findIndex(v => v.category === category);
            if (foundIndex !== -1) {
                currentIndex = foundIndex;
                loadVideo(currentIndex);
            } else {
                alert("Aucune vidéo disponible pour cette catégorie pour le moment.");
            }
        }

        function formatNumber(num) {
            if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num;
        }

        // Charger la première vidéo au démarrage de la page
        window.onload = () => {
            loadVideo(currentIndex);
        };
    </script>
</body>
</html>
