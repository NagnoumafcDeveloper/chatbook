<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ChatBook - Flux Vidéos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .main-screen {
            display: none;
            width: 100%;
            height: 100vh;
        }

        .main-screen.active-screen {
            display: block;
        }

        .video-container {
            width: 100%;
            height: calc(100vh - 60px);
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }

        .video-container::-webkit-scrollbar {
            display: none;
        }

        .video-player-box {
            position: relative;
            width: 100%;
            height: calc(100vh - 60px);
            scroll-snap-align: start;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Lecteur vidéo plein écran ultra-fluide pour iPhone */
        .video-element {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 20px 10px 20px;
            z-index: 50;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        .top-nav .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1877f2;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
        }

        .top-nav .tabs {
            display: flex;
            gap: 20px;
        }

        .top-nav .tabs span {
            font-size: 1.05rem;
            font-weight: bold;
            opacity: 0.4;
            cursor: pointer;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            padding-bottom: 5px;
        }

        .top-nav .tabs span.active {
            opacity: 1;
            border-bottom: 3px solid #ffffff;
        }

        .video-sidebar-left {
            position: absolute;
            bottom: 40px;
            left: 15px;
            z-index: 10;
            max-width: 75%;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
        }

        .video-sidebar-left .username { font-weight: bold; font-size: 1.05rem; margin-bottom: 5px; }
        .video-sidebar-left .description { font-size: 0.95rem; line-height: 1.3; }

        .video-sidebar-right {
            position: absolute;
            bottom: 80px;
            right: 25px;
            z-index: 80;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .action-button-touch {
            background: none;
            border: none;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            outline: none;
            padding: 5px;
        }

        .icon-circle {
            width: 54px;
            height: 54px;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.7rem;
            margin-bottom: 4px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.1s ease;
        }

        .icon-circle.liked {
            background-color: rgba(254, 44, 85, 0.9);
            border-color: #fe2c55;
            color: #fe2c55;
        }

        .action-button-touch span {
            font-size: 0.85rem;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .comment-sheet {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 65vh;
            background-color: #ffffff;
            color: #000000;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            z-index: 150;
            transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        .comment-sheet.open { bottom: 0; }
        .comment-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; border-bottom: 1px solid #e4e6eb; padding-bottom: 10px;}
        .comment-close { font-size: 1.6rem; cursor: pointer; color: #606770; padding: 5px; }
        .comment-body-scroll { flex: 1; overflow-y: auto; padding: 15px 0; }
        .comment-box-item { margin-bottom: 14px; font-size: 0.95rem; text-align: left; }
        .comment-author { font-weight: bold; color: #1877f2; }
        .comment-footer-input { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid #e4e6eb; }
        .comment-footer-input input { flex: 1; padding: 14px; border: 1px solid #ccd0d5; border-radius: 25px; font-size: 1rem; background-color: #f0f2f5; outline: none; color: #000000; }
        .comment-btn-send { background-color: #1877f2; color: #ffffff; border: none; padding: 0 20px; border-radius: 25px; font-weight: bold; cursor: pointer; }

        .admob-banner-placement {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #222222;
            border-top: 1px solid #333333;
            z-index: 70;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .admob-label { font-size: 0.65rem; color: #888888; font-weight: bold; }
        .admob-mock-content { font-size: 0.9rem; color: #00ffcc; font-weight: bold; }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="logo">ChatBook</div>
        <div class="tabs">
            <span id="btn-tab-abonnement" onclick="navigateTo('abonnement')">Abonnements</span>
            <span id="btn-tab-pourvous" class="active" onclick="navigateTo('pourvous')">Pour vous</span>
        </div>
    </div>

    <!-- FLUX POUR VOUS -->
    <div id="screen-pourvous" class="main-screen active-screen">
        <div class="video-container">
            <div class="video-player-box">
                <!-- Flux vidéo direct MP4 haute fluidité -->
                <video class="video-element" loop src="https://mixkit.co" autoplay muted playsinline></video>
                <div class="video-sidebar-left">
                    <div class="username">@NagnoumaDeveloper</div>
                    <div class="description">Bienvenue sur le flux vidéo officiel de ChatBook ! 🚀🔥 #tech</div>
                </div>
                <div class="video-sidebar-right">
                    <button class="action-button-touch" onclick="handleLikeInteraction(this)">
                        <div class="icon-circle">🤍</div>
                        <span>12.5K</span>
                    </button>
                    <button class="action-button-touch" onclick="triggerCommentSheet()">
                        <div class="icon-circle">💬</div>
                        <span id="comment-counter">2</span>
                    </button>
                    <button class="action-button-touch" onclick="shareOnWhatsApp()">
                        <div class="icon-circle">🔗</div>
                        <span>Partager</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- FLUX ABONNEMENTS -->
    <div id="screen-abonnement" class="main-screen">
        <div class="video-container">
            <div class="video-player-box">
                <video class="video-element" loop src="https://mixkit.co" playsinline></video>
                <div class="video-sidebar-left">
                    <div class="username">@GuineeTech</div>
                    <div class="description">Créer une multinationale depuis sa chambre. Tout est possible ! 🇬🇳🌐</div>
                </div>
                <div class="video-sidebar-right">
                    <button class="action-button-touch" onclick="handleLikeInteraction(this)">
                        <div class="icon-circle">🤍</div>
                        <span>45K</span>
                    </button>
                    <button class="action-button-touch" onclick="triggerCommentSheet()">
                        <div class="icon-circle">💬</div>
                        <span>0</span>
                    </button>
                    <button class="action-button-touch" onclick="shareOnWhatsApp()">
                        <div class="icon-circle">🔗</div>
                        <span>Partager</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- COMMENTAIRES -->
    <div id="bottomCommentSheet" class="comment-sheet">
        <div class="comment-header">
            <span>Commentaires</span>
            <span class="comment-close" onclick="dismissCommentSheet()">✕</span>
        </div>
