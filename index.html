<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBook - Inscription</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Fond dégradé du noir profond vers le rouge sombre */
            background: linear-gradient(180deg, #000000 0%, #1a0002 50%, #4a0005 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .signup-container {
            background-color: #111111; /* Boîtier noir carbone */
            width: 90%;
            max-width: 400px;
            padding: 35px 25px;
            border-radius: 20px;
            border: 1px solid #222222;
            box-shadow: 0 10px 30px rgba(229, 9, 20, 0.15); /* Lueur rouge discrète */
            text-align: center;
            box-sizing: border-box;
        }
        h1 {
            color: #e50914; /* Texte rouge vif */
            font-size: 36px;
            font-weight: bold;
            margin: 0 0 5px 0;
            letter-spacing: 1px;
        }
        p {
            color: #aaaaaa;
            font-size: 16px;
            margin: 0 0 25px 0;
        }
        .input-group {
            position: relative;
            margin-bottom: 16px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #333333;
            border-radius: 8px;
            background-color: #1a1a1a; /* Champs gris très foncé */
            color: #ffffff;
            box-sizing: border-box;
            font-size: 16px;
        }
        input::placeholder {
            color: #777777;
        }
        input:focus {
            outline: none;
            border-color: #e50914; /* Bordure rouge au clic */
        }
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 20px;
            user-select: none;
        }
        .btn-signup {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: #e50914; /* Bouton rouge principal */
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        .btn-signup:hover {
            background-color: #b80710;
        }
        .divider {
            border-top: 1px solid #222222;
            margin: 20px 0;
        }
        .login-link {
            color: #e50914;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
        }
        .login-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="signup-container">
    <h1>ChatBook</h1>
    <p>C'est rapide et facile.</p>
    
    <form id="signupForm">
        <div class="input-group">
            <input type="text" placeholder="Prénom" required>
        </div>
        
        <div class="input-group">
            <input type="text" placeholder="Nom de famille" required>
        </div>
        
        <div class="input-group">
            <input type="text" placeholder="Numéro de mobile ou e-mail" required>
        </div>
        
        <div class="input-group">
            <input type="password" id="password" placeholder="Nouveau mot de passe" required>
            <span class="password-toggle" id="togglePassword">👁️</span>
        </div>
        
        <button type="submit" class="btn-signup">S'inscrire</button>
    </form>
    
    <div class="divider"></div>
    
    <a href="#" class="login-link">Vous avez déjà un compte ?</a>
</div>

<script>
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#password');

    togglePassword.addEventListener('click', function () {
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        this.textContent = type === 'password' ? '👁️' : '🙈';
    });
</script>

</body>
</html>
