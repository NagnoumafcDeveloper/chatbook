<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBook - TikTok Mode</title>
    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 400px;
            height: 90vh;
            max-height: 750px;
            background-color: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .categories {
            display: flex;
            justify-content: space-around;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            font-size: 14px;
            font-weight: bold;
            z-index: 10;
        }
        .categories span {
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .categories span.active {
            opacity: 1;
            border-bottom: 2px solid #38bdf8;
            padding-bottom: 2px;
        }
        .video-area {
            flex: 1;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .video-area video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .sidebar-actions {
            position: absolute;
            right: 15px;
            bottom: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        .action-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            text-align: center;
            font-size: 12px;
            transition: transform 0.2s;
        }
        .action-btn:hover {
            transform: scale(1.1);
        }
        .action-btn span {
            display: block;
            font-size: 24px;
        }
        .action-btn.liked span {
            color: #ef4444;
        }
        .video-info {
            position: absolute;
            left: 15px;
            bottom: 20px;
            z-index: 10;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .video-info h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
        }
        .video-info p {
            margin: 0;
            font-size: 13px;
            color: #cbd5e1;
        }
        .next-btn-container {
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            text-align: center;
            z-index: 10;
        }
        .next-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .next-btn:hover {
            background: #1d4ed8;
        }
        /* Fenêtre de commentaires */
        .comments-modal {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: #1e293b;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s ease-in-out;
            z-index: 20;
        }
        .comments-modal.open {
            transform: translateY(0);
        }
        .comments-header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            font-weight: bold;
        }
        .close-comments {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
        .comments-body {
            padding: 15px;
            overflow-y: auto;
            flex: 1;
            font-size: 14px;
        }
        .comment-item {
            margin-bottom: 12px;
        }
        .comment-item strong {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Catégories -->
        <div class="categories">
            <span class="active" onclick="switchCategory(this)">[😄 Humour]</span>
            <span onclick="switchCategory(this)">[💪 Motivation]</span>
            <span onclick="switchCategory(this)">[👶 Enfants]</span>
        </div>

        <!-- Zone de la vidéo -->
        <div class="video-area">
            <!-- Vous pouvez mettre une balise <video src="..." id="myVideo" autoplay loop></video> -->
            <div style="color: #64748b; font-size: 14px;">Espace Vidéo</div>
        </div>

        <!-- Informations de la vidéo -->
        <div class="video-info">
            <h3 id="videoAuthor">@HumourTotal</h3>
            <p id="videoDesc">Une blague qui fait du bien dès le matin ! 💙✨</p>
        </div>

        <!-- Boutons d'actions verticaux -->
        <div class="sidebar-actions">
            <button class="action-btn" id="likeBtn" onclick="toggleLike()">
                <span id="likeIcon">❤️</span> 
                <span id="likeCount">432</span>
            </button>
            <button class="action-btn" onclick="toggleComments()">
                <span>💬</span> 
                <span id="commentCount">0</span>
            </button>
            <button class="action-btn" id="soundBtn" onclick="toggleSound()">
                <span id="soundIcon">🔊</span> Son
            </button>
            <button class="action-btn" onclick="shareVideo()">
                <span>↗️</span> Partager
            </button>
        </div>

        <!-- Bouton Vidéo suivante -->
        <div class="next-btn-container">
            <button class="next-btn" onclick="nextVideo()">Vidéo suivante ➡️</button>
        </div>

        <!-- Modale des commentaires -->
        <div class="comments-modal" id="commentsModal">
            <div class="comments-header">
                <span>Commentaires</span>
                <button class="close-comments" onclick="toggleComments()">✕</button>
            </div>
            <div class="comments-body">
                <div class="comment-item"><strong>@Utilisateur1:</strong> Trop drôle ! 😆</div>
                <div class="comment-item"><strong>@Testeur:</strong> Excellent contenu.</div>
            </div>
        </div>
    </div>

    <script>
        // Gestion des Likes
        let isLiked = false;
        let likesNum = 432;
        function toggleLike() {
            const btn = document.getElementById('likeBtn');
            const countElem = document.getElementById('likeCount');
            isLiked = !isLiked;
            if(isLiked) {
                btn.classList.add('liked');
                likesNum++;
            } else {
                btn.classList.remove('liked');
                likesNum--;
            }
            countElem.innerText = likesNum;
        }

        // Ouverture / Fermeture des commentaires
        function toggleComments() {
            const modal = document.getElementById('commentsModal');
            modal.classList.toggle('open');
        }

        // Gestion du Son
        let isMuted = false;
        function toggleSound() {
            const soundIcon = document.getElementById('soundIcon');
            isMuted = !isMuted;
            soundIcon.innerText = isMuted ? '🔇' : '🔊';
            // Si vous avez une balise <video id="myVideo">, ajoutez : document.getElementById('myVideo').muted = isMuted;
        }

        // Bouton Partager (Copie le lien)
        function shareVideo() {
            navigator.clipboard.writeText(window.location.href);
            alert("Lien copié dans le presse-papier ! 📋");
        }

        // Changement de catégorie
        function switchCategory(element) {
            document.querySelectorAll('.categories span').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            // Logique pour charger les vidéos de la catégorie sélectionnée
        }

        // Bouton Vidéo suivante (Simulation de changement)
        const videosData = [
            { author: "@HumourTotal", desc: "Une blague qui fait du bien dès le matin ! 💙✨", likes: 432 },
            { author: "@MotivationPro", desc: "Ne lâche rien, chaque effort compte ! 💪🔥", likes: 1205 },
            { author: "@KidsFun", desc: "Regarde cette réaction trop mignonne ! 🥰👶", likes: 890 }
        ];
        let currentIndex = 0;

        function nextVideo() {
            currentIndex = (currentIndex + 1) % videosData.length;
            document.getElementById('videoAuthor').innerText = videosData[currentIndex].author;
            document.getElementById('videoDesc').innerText = videosData[currentIndex].desc;
            likesNum = videosData[currentIndex].likes;
            document.getElementById('likeCount').innerText = likesNum;
            isLiked = false;
            document.getElementById('likeBtn').classList.remove('liked');
        }
    </script>

</body>
</html>
