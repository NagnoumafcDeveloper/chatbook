<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBook - TikTok Mode</title>
    <style>
        body {
            margin: 0;
            background-color: #0d1b2a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 400px;
            height: 95vh;
            max-height: 800px;
            background-color: #1b263b;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 25px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .app-header {
            padding: 15px 10px;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .app-title {
            margin: 0;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .categories {
            display: flex;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }
        .category-btn {
            background: #415a77;
            color: #e0e1dd;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .category-btn.active {
            background: white;
            color: #0d1b2a;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .video-area {
            flex: 1;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .sidebar-actions {
            position: absolute;
            right: 15px;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        .action-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            text-align: center;
            font-size: 11px;
            transition: transform 0.2s;
        }
        .action-btn:hover {
            transform: scale(1.1);
        }
        .action-btn span {
            display: block;
            font-size: 22px;
        }
        #likeIcon {
            filter: grayscale(100%) brightness(200%);
            transition: filter 0.2s;
        }
        .action-btn.liked #likeIcon {
            filter: none;
        }
        .video-info {
            position: absolute;
            left: 15px;
            bottom: 20px;
            z-index: 10;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .video-info h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
        }
        .video-info p {
            margin: 0;
            font-size: 13px;
            color: #e0e1dd;
        }
        .comments-modal {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: #1b263b;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s ease-in-out;
            z-index: 20;
        }
        .comments-modal.open {
            transform: translateY(0);
        }
        .comments-header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #415a77;
            font-weight: bold;
        }
        .close-comments {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
        .comments-body {
            padding: 15px;
            overflow-y: auto;
            flex: 1;
            font-size: 14px;
        }
        .comment-item {
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 8px;
        }
        .comments-footer {
            padding: 12px;
            border-top: 1px solid #415a77;
            display: flex;
            gap: 10px;
            background: #0d1b2a;
        }
        .comments-footer input {
            flex: 1;
            background: #1b263b;
            border: 1px solid #415a77;
            border-radius: 20px;
            padding: 8px 15px;
            color: white;
            outline: none;
            font-size: 13px;
        }
        .comments-footer input::placeholder {
            color: #94a3b8;
        }
        .comments-footer button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .comments-footer button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="app-header">
            <h1 class="app-title">ChatBook</h1>
            <div class="categories">
                <button class="category-btn active" onclick="switchCategory(this)">😄 Humour</button>
                <button class="category-btn" onclick="switchCategory(this)">💪 Motivation</button>
                <button class="category-btn" onclick="switchCategory(this)">👶 Enfants</button>
            </div>
        </div>

        <div class="video-area">
            <div style="color: #778da9; font-size: 14px;">Espace Vidéo</div>
        </div>

        <div class="video-info">
            <h3 id="videoAuthor">@MotivationPro</h3>
            <p id="videoDesc">Ne lâche rien, chaque effort compte ! 💪🔥</p>
        </div>

        <div class="sidebar-actions">
            <button class="action-btn" id="likeBtn" onclick="toggleLike()">
                <span id="likeIcon">❤️</span> 
                <span id="likeCount" style="font-size: 12px;">1206</span>
            </button>
            <button class="action-btn" onclick="toggleComments()">
                <span>💬</span> 
                <span id="commentCount" style="font-size: 12px;">1</span>
            </button>
            <button class="action-btn" id="soundBtn" onclick="toggleSound()">
                <span id="soundIcon">🔊</span> 
                <span style="font-size: 12px;">Son</span>
            </button>
            <button class="action-btn" onclick="shareVideo()">
                <span>↗️</span> 
                <span style="font-size: 12px;">Partager</span>
            </button>
        </div>

        <div class="comments-modal" id="commentsModal">
            <div class="comments-header">
                <span>Commentaires</span>
                <button class="close-comments" onclick="toggleComments()">✕</button>
            </div>
            <div class="comments-body" id="commentsBody">
                <div class="comment-item"><strong>@Moi:</strong> kk</div>
            </div>
            <div class="comments-footer">
                <input type="text" id="commentInput" placeholder="Ajouter un commentaire..." onkeypress="handleKeyPress(event)">
                <button onclick="addComment()">Envoyer</button>
            </div>
        </div>
    </div>

    <script>
        let isLiked = false;
        let likesNum = 1206;
        function toggleLike() {
            const btn = document.getElementById('likeBtn');
            const countElem = document.getElementById('likeCount');
            isLiked = !isLiked;
            if(isLiked) {
                btn.classList.add('liked');
                likesNum++;
            } else {
                btn.classList.remove('liked');
                likesNum--;
            }
            countElem.innerText = likesNum;
        }

        function toggleComments() {
            const modal = document.getElementById('commentsModal');
            modal.classList.toggle('open');
        }

        let isMuted = false;
        function toggleSound() {
            const soundIcon = document.getElementById('soundIcon');
            isMuted = !isMuted;
            soundIcon.innerText = isMuted ? '🔇' : '🔊';
        }

        function shareVideo() {
            if (navigator.share) {
                navigator.share({
                    title: 'ChatBook',
                    text: 'Regarde cette vidéo sur ChatBook !',
                    url: window.location.href,
                }).catch(() => {});
            } else {
                window.prompt("Copiez ce lien pour partager la vidéo :", window.location.href);
            }
        }

        let commentCount = 1;
        function addComment() {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if (text === "") return;

            const commentsBody = document.getElementById('commentsBody');
            const commentDiv = document.createElement('div');
            commentDiv.className = 'comment-item';
            commentDiv.innerHTML = <strong>@Moi:</strong> ${text};
            commentsBody.appendChild(commentDiv);

            input.value = "";
            commentsBody.scrollTop = commentsBody.scrollHeight;

            commentCount++;
            document.getElementById('commentCount').innerText = commentCount;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                addComment();
            }
        }

        function switchCategory(element) {
            document.querySelectorAll('.category-btn').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
