<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBook - TikTok Mode</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        .container {
            height: 100vh;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            overflow-x: hidden;
        }
        .video-slide {
            height: 100vh;
            width: 100vw;
            position: relative;
            scroll-snap-align: start;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .video-slide video {
            height: 100%;
            width: 100%;
            object-fit: cover;
        }
        .sidebar {
            position: absolute;
            right: 15px;
            bottom: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }
        .action-btn {
            background: rgba(0, 0, 0, 0.4);
            border: none;
            color: #fff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            font-size: 18px;
        }
        .action-btn:hover {
            background: rgba(0, 0, 0, 0.6);
        }
        .action-btn.active {
            color: #ff3b5c;
        }
        .action-count {
            font-size: 12px;
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            margin-top: -10px;
        }
        .video-info {
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 80px;
            z-index: 10;
        }
        .video-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        /* Style de la section des commentaires */
        .comments-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: rgba(0, 0, 0, 0.85);
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease-in-out;
            transform: translateY(100%);
            z-index: 20;
        }
        .comments-overlay.open {
            transform: translateY(0);
        }
        .comments-header {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }
        .close-comments {
            position: absolute;
            right: 15px;
            top: 15px;
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
        .comments-list {
            flex: 1;
            overflow-y: auto;

            outline: none;

        }
    </style>
</head>
<body>

    <div class="container" id="feed-container"></div>

    <!-- Les commentaires seront ajoutés dynamiquement par vidéo -->

    <script>
        async function loadVideos() {
            const container = document.getElementById('feed-container');
            container.innerHTML = '';

            const mockVideos = [
                {
                    id: 1,
                    title: "Première vidéo de test ChatBook",
                    url: "https://www.w3schools.com/html/mov_bbb.mp4",
                    likes: 13,
                    comments: ["Super vidéo !", "Génial !"]
                },
                {
                    id: 2,
                    title: "Deuxième vidéo de test",
                    url: "https://sample-videos.com/video123/mp4/720/big_buck_bunny_720p_1mb.mp4",
                    likes: 154,
                    comments: ["Incroyable", "Beau travail"]
                }
            ];

            mockVideos.forEach(video => {
                const slide = document.createElement('div');
                slide.className = 'video-slide';
                slide.setAttribute('data-id', video.id);
                slide.innerHTML = `
                    <video src="${video.url}" loop playsinline></video>
                    <div class="video-info">
                        <div class="video-title">${video.title}</div>
                    </div>
                    <div class="sidebar">
                        <button class="action-btn" onclick="toggleLike(this)">❤</button>
                        <span class="action-count like-count">${video.likes}</span>
                        <button class="action-btn" onclick="toggleComments(${video.id})">💬</button>
                        <span class="action-count">Coms</span>
                        <button class="action-btn" onclick="shareVideo('${video.title}')">↗</button>
                        <span class="action-count">Partager</span>
                    </div>
                    <div class="comments-overlay" id="comments-${video.id}">
                        <div class="comments-header">
                            Commentaires
                            <button class="close-comments" onclick="closeComments(${video.id})">✕</button>
                        </div>
                        <div class="comments-list">
                            ${video.comments.map(c => `<div class="comment-item">${c}</div>`).join('')}
                        </div>
                        <div class="comment-input-container">
                            <input type="text" class="comment-input" placeholder="Ajouter un commentaire...">
                            <button class="submit-comment" onclick="addComment(this, ${video.id})">Envoyer</button>
                        </div>
                    </div>
                `;
                container.appendChild(slide);
            });

            setupVideoAutoplay();
        }

        function setupVideoAutoplay() {
            const videos = document.querySelectorAll('video');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.play().catch(() => {});
                    } else {
                        entry.target.pause();
                    }
                });
            }, { threshold: 0.7 });

            videos.forEach(video => observer.observe(video));
        }

        function toggleLike(btn) {
            btn.classList.toggle('active');
            let countSpan = btn.parentElement.querySelector('.like-count');
            let count = parseInt(countSpan.textContent);
            count = btn.classList.contains('active') ? count + 1 : count - 1;
            countSpan.textContent = count;
        }

        function toggleComments(videoId) {
            const overlay = document.getElementById(`comments-${videoId}`);
            overlay.classList.add('open');
        }

        function closeComments(videoId) {
            const overlay = document.getElementById(`comments-${videoId}`);
            overlay.classList.remove('open');
        }

        function addComment(btn, videoId) {
            const container = btn.parentElement;
            const input = container.querySelector('.comment-input');
            const list = btn.parentElement.parentElement.querySelector('.comments-list');
            
            if (input.value.trim() !== '') {
                const newComment = document.createElement('div');
                newComment.className = 'comment-item';
                newComment.textContent = input.value;
                list.appendChild(newComment);
                input.value = '';
            }
        }

        function shareVideo(title) {
            if (navigator.share) {
                navigator.share({
                    title: 'ChatBook',
                    text: `Regarde cette vidéo sur ChatBook : ${title}`,
                    url: window.location.href,
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href)
                    .then(() => alert("Lien copié dans le presse-papier !"))
                    .catch(() => alert("Impossible de copier le lien."));
            }
        }

        loadVideos();
    </script>
</body>
</html>
