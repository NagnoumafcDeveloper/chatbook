<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatBook</title>
<style>
body{background:#2563eb;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:Arial}
.card{background:white;width:90%;max-width:380px;border-radius:20px;padding:28px 22px;text-align:center}
h1{color:#0a7cff;margin:0;font-size:34px;font-weight:800}
.sub{color:#888;font-size:14px;margin:8px 0 20px}
input{width:100%;padding:14px;margin-bottom:12px;border:none;background:#f1f5f9;border-radius:10px;box-sizing:border-box;font-size:15px;outline:none}
input:focus{background:#e8eef7}
.btn{width:100%;background:#22c55e;color:white;border:none;padding:13px;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer}
.btn:active{transform:scale(0.97)}
.link{color:#0a7cff;display:block;margin-top:16px;font-size:13px;text-decoration:none}
.msg{display:none;padding:12px;border-radius:10px;margin-bottom:12px;font-size:13px;font-weight:bold}
.msg.error{background:#fee2e2;color:#dc2626;display:none}
.msg.ok{background:#dcfce7;color:#16a34a}
</style>
</head>
<body>
<div class="card">
<h1>ChatBook</h1>
<p class="sub">C'est rapide et facile.</p>

<div id="msgError" class="msg error"></div>
<div id="msgOk" class="msg ok"></div>

<input id="prenom" placeholder="Prénom" value="Condé">
<input id="nom" placeholder="Nom de famille" value="Facely">
<input id="email" placeholder="Numéro de mobile ou e-mail">
<input id="pass" type="password" placeholder="Mot de passe">

<button class="btn" onclick="inscrire()">S'inscrire</button>
<a class="link" href="#">Vous avez déjà un compte?</a>
</div>

<script>
function inscrire(){
  let p=document.getElementById('prenom').value.trim();
  let n=document.getElementById('nom').value.trim();
  let e=document.getElementById('email').value.trim();
  let m=document.getElementById('pass').value.trim();
  let err=document.getElementById('msgError');
  let ok=document.getElementById('msgOk');

  err.style.display='none';
  ok.style.display='none';

  if(!p||!n||!e||!m){
    err.textContent="⚠️ Remplis tous les champs";
    err.style.display='block';
    return;
  }
  if(m.length<4){
    err.textContent="Mot de passe trop court (4 min)";
    err.style.display='block';
    return;
  }

  // Sauvegarde
  localStorage.setItem('chatbook_user', JSON.stringify({prenom:p, nom:n}));

  ok.textContent="✅ Compte créé : "+p+" "+n+" - Redirection...";
  ok.style.display='block';

  setTimeout(()=>{
    window.location.href="accueil.html";
  },1200);
}
</script>
</body>
</html>
