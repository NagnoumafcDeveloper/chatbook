<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Chatbook</title>
</head>
<body>

    <div class="login-container">
        <h2>Connexion à Chatbook</h2>
        
        <!-- Le formulaire sans attribut "action" -->
        <form id="loginForm">
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>
            <div>
                <label for="password">Mot de passe</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Se connecter</button>
        </form>
    </div>

    <!-- Le script JavaScript pour gérer la transition proprement -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            // Empêche le rechargement brutal ou l'appel serveur par défaut (évite l'erreur 405)
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Vérification simple (vous pouvez la personnaliser)
            if(email && password) {
                // Redirection directe vers la page d'accueil
                window.location.href = "accueil.html";
            } else {
                alert("Veuillez remplir tous les champs.");
            }
        });
    </script>

</body>
</html>
