<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBook - TikTok Mode</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #4a154b, #2b1055);
            overflow: hidden;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            padding: 15px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .categories {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            z-index: 10;
        }
        .category-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .category-btn.active, .category-btn:hover {
            background: white;
            color: #2b1055;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .main-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 78vh;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .sidebar {
            position: absolute;
            right: 15px;
            bottom: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        .action-btn {
            background: rgba(0, 0, 0, 0.5);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            font-size: 20px;
            transition: transform 0.2s;
        }
        .action-btn:hover {
            transform: scale(1.1);
        }
        .action-btn span {
            font-size: 11px;
            margin-top: 3px;
            font-weight: bold;
        }
        .video-info {
            position: absolute;
            left: 15px;
            bottom: 20px;
            max-width: 75%;
            z-index: 10;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        .video-info h3 {
            font-size: 16px;
            color: #00ffcc;
            margin-bottom: 5px;
        }
        .video-info p {
            font-size: 13px;
            color: #eee;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <header>ChatBook</header>

    <!-- Catégories -->
    <div class="categories">
        <button class="category-btn active" onclick="switchCategory('humour', this)">😄 Humour</button>
        <button class="category-btn" onclick="switchCategory('motivation', this)">💪 Motivation</button>
        <button class="category-btn" onclick="switchCategory('enfants', this)">👶 Enfants</button>
    </div>

    <!-- Conteneur Vidéo Principal -->
    <div class="main-container">
        <video id="videoPlayer" src="" controls autoplay muted loop></video>

        <!-- Boutons d'interaction à droite -->
        <div class="sidebar">
            <button class="action-btn" id="likeBtn" onclick="toggleLike()">
                ❤️ <span id="likeCount">12.5K</span>
            </button>
            <button class="action-btn" onclick="openComments()">
                💬 <span id="commentCount">2</span>
            </button>
            <button class="action-btn" onclick="shareVideo()">
                🔗 <span>Partager</span>
            </button>
        </div>

        <!-- Informations de la vidéo -->
        <div class="video-info">
            <h3 id="videoAuthor">@NagnoumaDeveloper</h3>
            <p id="videoDesc">Préparez-vous à rire ! Les meilleures vidéos d'humour positives sont ici. 🤣 ✨ #détente</p>
        </div>
    </div>

    <script>
        // Base de données intégrée contenant toutes les vidéos et informations
        const database = {
            humour: {
                url: 'https://www.w3schools.com/html/mov_bbb.mp4',
                author: '@NagnoumaDeveloper',
                desc: 'Préparez-vous à rire ! Les meilleures vidéos d\'humour positives sont ici. 🤣 ✨ #détente',
                likes: 12500,
                comments: 2,
                liked: false
            },
            motivation: {
                url: 'https://www.w3schools.com/html/movie.mp4',
                author: '@MotivationDaily',
                desc: 'Ne lâchez rien, chaque petit effort compte pour réussir vos grands projets ! 🚀💪',
                likes: 8400,
                comments: 45,
                liked: false
            },
            enfants: {
                url: 'https://www.w3schools.com/html/mov_bbb.mp4',
                author: '@KidsFun',
                desc: 'De superbes moments de joie et de rires pour les enfants ! 👶✨',
                likes: 3200,
                comments: 12,
                liked: false
            }
        };

        let currentCategory = 'humour';

        function loadCategoryData(category) {
            currentCategory = category;
            const data = database[category];
            const player = document.getElementById('videoPlayer');

            player.src = data.url;
            document.getElementById('videoAuthor').innerText = data.author;
            document.getElementById('videoDesc').innerText = data.desc;
            document.getElementById('likeCount').innerText = formatNumber(data.likes);
            document.getElementById('commentCount').innerText = data.comments;

            // Mise à jour de la couleur du bouton like selon l'état
            const likeBtn = document.getElementById('likeBtn');
            likeBtn.style.color = data.liked ? '#ff4d4d' : 'white';

            player.play().catch(e => console.log("Lecture automatique gérée :", e));
        }

        function switchCategory(category, btnElement) {
            // Gestion visuelle des boutons de catégorie actifs
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            // Charger les données correspondantes
            loadCategoryData(category);
        }

        function toggleLike() {
            const data = database[currentCategory];
            if (!data.liked) {
                data.likes++;
                data.liked = true;
                document.getElementById('likeBtn').style.color = '#ff4d4d';
            } else {
                data.likes--;
                data.liked = false;
                document.getElementById('likeBtn').style.color = 'white';
            }
            document.getElementById('likeCount').innerText = formatNumber(data.likes);
        }

        function openComments() {
            const data = database[currentCategory];
            alert(`Commentaires (${data.comments}) : Superbe vidéo !`);
        }

        function shareVideo() {
            if (navigator.share) {
                navigator.share({
                    title: 'ChatBook Video',
                    url: window.location.href
                }).catch(console.error);
            } else {
                alert("Lien de la vidéo copié !");
            }
        }

        function formatNumber(num) {
            if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num;
        }

        // Lancement initial au chargement de la page
        window.onload = () => {
            loadCategoryData('humour');
        };
    </script>
