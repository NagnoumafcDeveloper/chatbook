```html
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatBook</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1e29;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 400px;
      height: 100vh;
      background-color: #0b0f19;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Catégories tout en haut */
    .categories {
      position: absolute;
      top: 20px;
      display: flex;
      gap: 15px;
      font-weight: bold;
      font-size: 14px;
      opacity: 0.9;
      z-index: 10;
    }

    .categories span {
      cursor: pointer;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .interactions {
      position: absolute;
      right: 15px;
      bottom: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      z-index: 10;
    }

    .icon-btn {
      background: rgba(0, 0, 0, 0.4);
      border: none;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: background 0.3s;
      position: relative;
    }

    .icon-btn:hover {
      background: rgba(0, 0, 0, 0.6);
    }

    .icon-btn span {
      font-size: 20px;
    }

    .icon-btn p {
      font-size: 10px;
      margin: 2px 0 0 0;
      line-height: normal;
    }

    .red-dot {
      width: 10px;
      height: 10px;
      background-color: #ff3b30;
      border-radius: 50%;
      position: absolute;
      top: -2px;
      right: -2px;
      border: 2px solid #0b0f19;
    }

    .video-info {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 80px;
      z-index: 10;
    }

    .username {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 5px;
    }

    .description {
      font-size: 14px;
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Texte des catégories tout en haut -->
    <div class="categories">
      <span>😄 Humour</span>
      <span>💪 Motivation</span>
      <span>👶 Enfants</span>
    </div>

    <div class="video-wrapper">
      
      <!-- Boutons d'interaction sur le côté droit -->
      <div class="interactions">
        
        <!-- Bouton S'abonner -->
        <button class="icon-btn" id="subscribe-btn" type="button">
          <span>➕</span>
          <p id="subscribe-text">Abonner</p>
          <div class="red-dot" id="red-dot"></div>
        </button>
        
        <!-- Bouton Like (Cœur) -->
        <button class="icon-btn" id="like-btn" type="button">
          <span id="like-icon">🤍</span>
          <p id="like-count">431</p>
        </button>
        
        <!-- Bouton Commentaires -->
        <button class="icon-btn" id="comment-btn" type="button">
          <span>💬</span>
          <p>0</p>
        </button>
        
        <!-- Bouton Favoris -->
        <button class="icon-btn" id="favorite-btn" type="button">
          <span id="favorite-icon">🔖</span>
          <p>Favoris</p>
        </button>
        
        <!-- Bouton Son -->
        <button class="icon-btn" id="sound-btn" type="button">
          <span id="sound-icon">🔊</span>
          <p id="sound-text">Son</p>
        </button>
        
        <!-- Bouton Partager -->
        <button class="icon-btn" id="share-btn" type="button">
          <span id="share-icon">🔗</span>
          <p>Partager</p>
        </button>
        
      </div>

      <div class="video-info">
        <div class="username">@ChatBookUser</div>
        <div class="description">Bienvenue sur mon flux vidéo ! 🚀✨</div>
      </div>

    </div>
  </div>

  <script>
    // 1. Abonnement
    const subscribeBtn = document.getElementById('subscribe-btn');
    const redDot = document.getElementById('red-dot');
    const subscribeText = document.getElementById('subscribe-text');
    let isSubscribed = false;

    subscribeBtn.onclick = function() {
      isSubscribed = !isSubscribed;
      if (isSubscribed) {
        redDot.style.display = 'none';
        subscribeText.textContent = 'Abonné';
        subscribeBtn.style.background = 'rgba(255, 59, 48, 0.5)';
      } else {
        redDot.style.display = 'block';
        subscribeText.textContent = 'Abonner';
        subscribeBtn.style.background = 'rgba(0, 0, 0, 0.4)';
      }
    };

    // 2. Like (Cœur)
    const likeBtn = document.getElementById('like-btn');
    const likeIcon = document.getElementById('like-icon');
    const likeCount = document.getElementById('like-count');
    let isLiked = false;

    likeBtn.onclick = function() {
      isLiked = !isLiked;
      if (isLiked) {
        likeIcon.textContent = '❤️';
        likeCount.textContent = '432';
      } else {
        likeIcon.textContent = '🤍';
        likeCount.textContent = '431';
      }
    };

    // 3. Commentaires (Vide pour ne pas avoir d'alerte)
    const commentBtn = document.getElementById('comment-btn');
    commentBtn.onclick = function() {
      // Pour l'instant, aucune action n'est définie ici, cela évite l'alignement développé.
    };

    // 4. Favoris
    const favoriteBtn = document.getElementById('favorite-btn');
    const favoriteIcon = document.getElementById('favorite-icon');
    let isFavorited = false;

    favoriteBtn.onclick = function() {
      isFavorited = !isFavorited;
      if (isFavorited) {
        favoriteIcon.textContent = '❤️';
        favoriteBtn.style.background = 'rgba(255, 59, 48, 0.5)';
      } else {
        favoriteIcon.textContent = '🔖';
        favoriteBtn.style.background = 'rgba(0, 0, 0, 0.4)';
      }
    };

    // 5. Son (Volume)
    const soundBtn = document.getElementById('sound-btn');
    const soundIcon = document.getElementById('sound-icon');
    const soundText = document.getElementById('sound-text');
    let isMuted = false;

    soundBtn.onclick = function() {
      isMuted = !isMuted;
      if (isMuted) {
        soundIcon.textContent = '🔇';
        soundText.textContent = 'Muet';
        soundBtn.style.background = 'rgba(255, 59, 48, 0.5)';
      } else {
        soundIcon.textContent = '🔊';
        soundText.textContent = 'Son';
        soundBtn.style.background = 'rgba(0, 0, 0, 0.4)';
      }
    };

    // 6. Partager
    const shareBtn = document.getElementById('share-btn');
    shareBtn.onclick = function() {
      alert("Lien de partage copié !");
    };
  </script>

</body>
</html>
