<!DOCTYPE html>

            justify-content: center;
            align-items: center;

            font-size: 18px;

<body>

    <div class="container" id="feed-container">
        <div id="loading">Chargement des vidéos...</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ddftothrbbaqsfjffzby.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkZnRvdGhyYmJhcXNmamZmemJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NjYzNjAsImV4cCI6MjEwNzA0MjM2MH0.4IRm2E0d8BU7PSvXDS6StmloqPLAMZQmAjOvaIz7N-w';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadVideos() {
            const container = document.getElementById('feed-container');
            container.innerHTML = '';

            const { data: videos, error } = await supabase
                .from('videos')
                .select('*');

            if (error) {
                console.error("Erreur lors du chargement des vidéos :", error);
                container.innerHTML = '<div id="loading">Erreur de chargement</div>';
                return;
            }

            if (!videos || videos.length === 0) {
                container.innerHTML = '<div id="loading">Aucune vidéo trouvée</div>';
                return;
            }

            videos.forEach(video => {
                const slide = document.createElement('div');
                slide.className = 'video-slide';
                slide.innerHTML = `
                    <video src="https://www.w3schools.com/html/mov_bbb.mp4" loop playsinline></video>
                    <div class="video-info">
                        <div class="video-title">${video.titre}</div>
                    </div>
                    <div class="sidebar">
                        <button class="action-btn" onclick="toggleLike(this)">❤</button>
                        <span class="action-count like-count">0</span>
                        <button class="action-btn" onclick="toggleComments(${video.id})">💬</button>
                        <span class="action-count">Coms</span>
                        <button class="action-btn" onclick="shareVideo('${video.titre}')">↗</button>
                        <span class="action-count">Partager</span>
                    </div>
                    <div class="comments-overlay" id="comments-${video.id}">
                        <div class="comments-header">
                            Commentaires
                            <button class="close-comments" onclick="closeComments(${video.id})">✕</button>
                        </div>
                        <div class="comments-list">
                            <div class="comment-item">Aucun commentaire pour le moment.</div>
                        </div>
                        <div class="comment-input-container">
                            <input type="text" class="comment-input" placeholder="Ajouter un commentaire...">
                            <button class="submit-comment" onclick="addComment(this, ${video.id})">Envoyer</button>
                        </div>
                    </div>
                `;
                container.appendChild(slide);
            });

            setupVideoAutoplay();
        }

        function setupVideoAutoplay() {
            const videos = document.querySelectorAll('video');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.play().catch(() => {});
                    } else {
                        entry.target.pause();
                    }
                });
            }, { threshold: 0.7 });

            videos.forEach(video => observer.observe(video));
        }

        function toggleLike(btn) {
            btn.classList.toggle('active');
            let countSpan = btn.parentElement.querySelector('.like-count');
            let count = parseInt(countSpan.textContent);
            count = btn.classList.contains('active') ? count + 1 : count - 1;
            countSpan.textContent = count;
        }

        function toggleComments(videoId) {
            const overlay = document.getElementById(`comments-${videoId}`);
            overlay.classList.add('open');
        }

        function closeComments(videoId) {
            const overlay = document.getElementById(`comments-${videoId}`);
            overlay.classList.remove('open');
        }

        function addComment(btn, videoId) {
            const container = btn.parentElement;
            const input = container.querySelector('.comment-input');
            const list = btn.parentElement.parentElement.querySelector('.comments-list');
            
            if (input.value.trim() !== '') {
                const newComment = document.createElement('div');
                newComment.className = 'comment-item';
                newComment.textContent = input.value;
                
                const noCommentMsg = list.querySelector('.comment-item');
                if (noCommentMsg && noCommentMsg.textContent.includes("Aucun commentaire")) {
                    list.innerHTML = '';
                }
                
                list.appendChild(newComment);
                input.value = '';
            }
        }

        function shareVideo(title) {
            if (navigator.share) {
                navigator.share({
                    title: 'ChatBook',
                    text: `Regarde cette vidéo sur ChatBook : ${title}`,
                    url: window.location.href,
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href)
                    .then(() => alert("Lien copié dans le presse-papier !"))
                    .catch(() => alert("Impossible de copier le lien."));
            }
        }

        loadVideos();
    </script>
</body>
</html>
