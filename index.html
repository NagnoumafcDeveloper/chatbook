<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBook - TikTok Mode</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 800px;
            background-color: #111;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 14px;
            font-weight: bold;
            color: #ccc;
        }
        .header span {
            cursor: pointer;
        }
        .header span.active {
            color: #fff;
            border-bottom: 2px solid #fff;
            padding-bottom: 2px;
        }
        .content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            position: relative;
        }
        .video-info {
            margin-bottom: 20px;
        }
        .username {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }
        .description {
            font-size: 14px;
            color: #ddd;
        }
        .sidebar {
            position: absolute;
            right: 10px;
            bottom: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .action-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            gap: 5px;
        }
        .action-btn svg {
            width: 32px;
            height: 32px;
            transition: transform 0.2s, fill 0.2s;
        }
        .action-btn:active svg {
            transform: scale(1.2);
        }
        .next-btn {
            background-color: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 20px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- En-tête -->
        <div class="header">
            <span>[😄 Humour]</span>
            <span>[💪 Motivation]</span>
            <span>[👶 Enfants]</span>
        </div>

        <!-- Corps de la vidéo / Infos -->
        <div class="content">
            <div class="video-info">
                <div class="username">@HumourTotal</div>
                <div class="description">Une blague qui fait du bien dès le matin ! 🎭✨</div>
            </div>

            <!-- Boutons d'interaction latéraux -->
            <div class="sidebar">
                <!-- Bouton Like -->
                <button class="action-btn" id="like-btn" onclick="toggleLike()">
                    <svg id="heart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                    <span id="like-count">431</span>
                </button>

                <!-- Bouton Commentaire -->
                <button class="action-btn">
                    💬 <span id="comment-count">1</span>
                </button>

                <!-- Bouton Son -->
                <button class="action-btn">
                    🔊 <span>Son</span>
                </button>

                <!-- Bouton Partager -->
                <button class="action-btn">
                    🔗 <span>Partager</span>
                </button>
            </div>

            <!-- Bouton Vidéo suivante -->
            <button class="next-btn" onclick="nextVideo()">Vidéo suivante ➡️</button>
        </div>
    </div>

    <script>
        // État initial de la vidéo (aimée ou non)
        let isLiked = false;
        let likeCount = 431;

        function toggleLike() {
            isLiked = !isLiked;
            const heartIcon = document.getElementById('heart-icon');
            const likeCountSpan = document.getElementById('like-count');

            if (isLiked) {
                // Devient rouge et remplit le cœur
                heartIcon.setAttribute('fill', '#ff3b30');
                heartIcon.setAttribute('stroke', '#ff3b30');
                likeCount += 1;
            } else {
                // Devient blanc (vide)
                heartIcon.setAttribute('fill', 'none');
                heartIcon.setAttribute('stroke', 'currentColor');
                likeCount -= 1;
            }

            likeCountSpan.textContent = likeCount;
        }

        function nextVideo() {
            // Réinitialisation pour la prochaine vidéo (état non liké par défaut)
            isLiked = false;
            const heartIcon = document.getElementById('heart-icon');
            heartIcon.setAttribute('fill', 'none');
            heartIcon.setAttribute('stroke', 'currentColor');
            
            // Vous pouvez charger une autre vidéo ici
            alert("Chargement de la vidéo suivante...");
        }
    </script>
</body>
</html>
