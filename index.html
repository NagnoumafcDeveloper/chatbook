<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBook - Inscription</title>
    <!-- Lien vers FontAwesome pour les icônes (comme l'œil) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            width: 350px;
            text-align: center;
        }

        h1 {
            color: #ff3b3b;
            margin-bottom: 5px;
        }

        p {
            color: #b0b0b0;
            font-size: 14px;
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 5px;
            background-color: #2a2a2a;
            color: #ffffff;
            font-size: 14px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #ff3b3b;
        }

        .password-container {
            position: relative;
            width: 100%;
        }

        .password-container input {
            padding-right: 40px;
        }

        .password-container .fa-eye, 
        .password-container .fa-eye-slash {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #b0b0b0;
            cursor: pointer;
        }

        button[type="submit"] {
            background-color: #ff3b3b;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        button[type="submit"]:hover {
            background-color: #e03232;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ChatBook</h1>
        <p>C'est rapide et facile.</p>
        
        <form id="signupForm">
            <input type="text" id="prenom" placeholder="Prénom" required>
            <input type="text" id="nom" placeholder="Nom" required>
            <input type="email" id="email" placeholder="Adresse e-mail" required>
            
            <div class="password-container">
                <input type="password" id="password" placeholder="Nouveau mot de passe" required>
                <i class="fa-solid fa-eye" id="togglePassword"></i>
            </div>
            
            <button type="submit">S'inscrire</button>
        </form>
    </div>

    <script>
        // 1. Gestion du bouton "œil" pour afficher/masquer le mot de passe
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            // Alterner le type de l'input
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Changer l'icône de l'œil
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        // 2. Gestion du formulaire et du bouton "S'inscrire"
        const signupForm = document.getElementById('signupForm');

        signupForm.addEventListener('submit', function (e) {
            e.preventDefault(); // Empêche le rechargement de la page

            // Récupération des valeurs saisies
            const prenom = document.getElementById('prenom').value;
            const nom = document.getElementById('nom').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Création d'un objet utilisateur
            const userData = { prenom, nom, email, password };

            // Stockage temporaire (par exemple dans le localStorage du navigateur)
            localStorage.setItem('chatbook_user', JSON.stringify(userData));

            alert("Inscription réussie ! Bienvenue sur ChatBook, " + prenom + ".");

            // Redirection vers votre page de fil d'actualité (remplacez "feed.html" par votre page cible si besoin)
            // window.location.href = "feed.html";
        });
    </script>
</body>
</html>
