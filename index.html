<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ChatBook - Recommencement</title>
    <!-- Chargement officiel de Supabase pour plus tard -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* --- Styles de Base - Pour le plein écran --- */
        :root {
            --cb-red: #e50914; /* Rouge ChatBook */
            --cb-bg: #000000;
            --cb-text: #ffffff;
            --cb-nav-inactive: #808080;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--cb-bg);
            color: var(--cb-text);
            height: 100vh;
            overflow: hidden; /* Empêche le défilement global de la page */
            display: flex;
            justify-content: center;
        }

        /* --- Conteneur Principal --- */
        .app-container {
            width: 100%;
            max-width: 450px; /* Largeur max type téléphone */
            height: 100vh;
            position: relative;
            background-color: var(--cb-bg);
        }

        /* --- Zone du Flux Vidéo (Plein Écran) --- */
        .feed-container {
            width: 100%;
            height: 100%;
            overflow-y: scroll; /* Défilement vertical pour les vidéos */
            scroll-snap-type: y mandatory; /* "Aimante" les vidéos */
            scrollbar-width: none; /* Cache la barre sur Firefox */
        }
        .feed-container::-webkit-scrollbar {
            display: none; /* Cache la barre sur Chrome/Safari */
        }

        /* Section d'UNE vidéo */
        .video-section {
            width: 100%;
            height: 100vh; /* Prend toute la hauteur */
            scroll-snap-align: start; /* S'aligne parfaitement au début */
            position: relative;
        }

        /* La vidéo elle-même */
        .video-player {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Remplit tout l'espace sans déformer */
        }

        /* --- En-tête Supérieur (Top Bar) --- */
        .top-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 100; /* Passe au-dessus de la vidéo */
            background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 100%);
        }

        .logo {
            color: var(--cb-red);
            font-size: 26px;
            font-weight: bold;
            text-decoration: none;
        }

        .top-icons {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .top-icon-btn {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            padding: 0;
        }
        
        .top-icon-svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }

        /* --- Actions Latérales Droites (Side Actions) --- */
        .side-actions {
            position: absolute;
            right: 15px;
            bottom: 120px; /* Juste au-dessus de la nav bar et des infos */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 90;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #ffffff;
            cursor: pointer;
        }

        /* Le cercle de profil spécial */
        .profile-circle {
            width: 50px;
            height: 50px;
            background-color: #9c27b0; /* Violet C sur l'image */
            border-radius: 50%;
            border: 2px solid #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            position: relative;
        }
        
        /* Le petit + rouge sur le profil */
        .profile-add {
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--cb-red);
            color: #ffffff;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
        }

        .action-svg {
            width: 30px;
            height: 30px;
            fill: #ffffff;
        }

        .action-label {
            font-size: 12px;
            margin-top: 5px;
        }

        /* Icône de disque de musique tournant */
        .music-disc {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: #333;
            border: 8px solid #111;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* --- Informations Vidéo (Bottom Left Info) --- */
        .video-info {
            position: absolute;
            left: 20px;
            bottom: 90px; /* Au-dessus de la nav bar */
            max-width: 70%;
            z-index: 80;
            color: #ffffff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .author {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .description {
            font-size: 15px;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .music-line {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        
        .music-icon-svg {
            width: 16px;
            height: 16px;
            fill: #ffffff;
        }

        /* --- Barre de Navigation Inférieure (Bottom Nav) --- */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px; /* Un peu plus haute pour le style */
            background-color: rgba(0,0,0,0.9);
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
            padding-bottom: 15px;
            box-sizing: border-box;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--cb-nav-inactive);
            text-decoration: none;
            font-size: 12px;
            gap: 5px;
            flex: 1;
            text-align: center;
        }

        .nav-item.active {
            color: var(--cb-text);
        }

        .nav-icon-svg {
            width: 24px;
            height: 24px;
            fill: currentcolor;
        }

        /* Le bouton Publier central spécial */
        .btn-publish-special {
            width: 50px;
            height: 35px;
            background: #ffffff;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000000;
            font-weight: bold;
            font-size: 24px;
            border: none;
            position: relative;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

    </style>
</head>
<body>

    <div class="app-container">
        <!-- --- En-tête --- -->
        <header class="top-header">
            <a href="#" class="logo">ChatBook</a>
            <div class="top-icons">
                <button class="top-icon-btn">
                    <!-- Icône Recherche (Loupe) -->
                    <svg class="top-icon-svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                </button>
                <button class="top-icon-btn">
                    <!-- Icône Son (Haut-parleur) -->
                    <svg class="top-icon-svg" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </button>
            </div>
        </header>

        <!-- --- Flux Vidéo (Conteneur) --- -->
        <div class="feed-container" id="feedContainer">
            
            <!-- EXEMPLE DE VIDÉO 1 (Copie de votre image) -->
            <section class="video-section">
                <!-- La vidéo (Muette pour l'autoplay) -->
                <video class="video-player" loop muted autoplay playsinline>
                    <source src="https://assets.mixkit.co/videos/preview/mixkit-bright-red-tulip-in-the-garden-4422-large.mp4" type="video/mp4">
                    Votre navigateur ne supporte pas la vidéo.
                </video>

                <!-- Actions Latérales -->
                <div class="side-actions">
                    <div class="action-item">
                        <div class="profile-circle">C <div class="profile-add">+</div></div>
                    </div>
                    <div class="action-item">
                        <!-- Icône J'aime (Cœur) -->
                        <svg class="action-svg" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        <span class="action-label">1,2 K</span>
                    </div>
                    <div class="action-item">
                        <!-- Icône Commentaire (Bulle) -->
                        <svg class="action-svg" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                        <span class="action-label">128</span>
                    </div>
                    <div class="action-item">
                        <!-- Icône Partager (Flèche) -->
                        <svg class="action-svg" viewBox="0 0 24 24"><path d="M11.733 17.26c-2.569 0-4.667-2.098-4.667-4.667H3.5l6-6.5 6 6.5h-3.433c0 1.282.43 2.457 1.155 3.393.724.936 1.761 1.572 2.945 1.774v2.02c-1.328-.15-2.567-.655-3.601-1.454a4.618 4.618 0 0 1-1.808-3.04l.001-.06z"/></svg>
                        <span class="action-label">Partager</span>
                    </div>
                    <div class="action-item" style="margin-top: 20px;">
                        <!-- Icône Musique tournante -->
                        <div class="music-disc"></div>
                        <span class="action-label" style="color:var(--cb-nav-inactive)">Son</span>
                    </div>
                </div>

                <!-- Informations Vidéo -->
                <div class="video-info">
                    <div class="author">@chatbook_officiel</div>
                    <div class="description">Bienvenue sur ChatBook 🌍 Découvre les vidéos et partage tes meilleurs moments</div>
                    <div class="music-line">
                        <!-- Icône note de musique -->
                        <svg class="music-icon-svg" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                        <span>Son original - ChatBook</span>
                    </div>
                </div>
            </section>

        </div>

        <!-- --- Barre de Navigation Inférieure --- -->
        <nav class="bottom-nav">
            <a href="index.html" class="nav-item active">
                <svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>Accueil</span>
            </a>
            <a href="#" class="nav-item">
                <svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <span>Découvrir</span>
            </a>
            <div class="nav-item">
                <button class="btn-publish-special" onclick="alert('Fonctionnalité de publication bientôt disponible !')">+</button>
                <span>Publier</span>
            </div>
            <a href="#" class="nav-item">
                <svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
                <span>Messages</span>
            </a>
            <a href="#" class="nav-item">
                <svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span>Profil</span>
            </a>
        </nav>
    </div>

    <script>
        // --- Petit Script pour gérer le défilement et la lecture ---
        const container = document.getElementById('feedContainer');
        const videos = document.querySelectorAll('.video-player');

        // Fonction pour jouer la vidéo visible
        function handleScroll() {
            videos.forEach(video => {
                const rect = video.getBoundingClientRect();
                // Si la vidéo est centrée à l'écran
                if (rect.top >= -window.innerHeight / 2 && rect.top < window.innerHeight / 2) {
                    video.play().catch(() => {
                        // Gère le blocage de l'autoplay si non muté
                        video.muted = true;
                        video.play();
                    });
                } else {
                    video.pause();
                }
            });
        }

        // Écoute le défilement
        container.addEventListener('scroll', handleScroll);
        // Joue la première au chargement
        window.addEventListener('load', handleScroll);

    </script>
</body>
</html>
