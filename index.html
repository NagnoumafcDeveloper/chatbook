```html
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatBook</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1e29;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 400px;
      height: 100vh;
      background-color: #0b0f19;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .interactions {
      position: absolute;
      right: 15px;
      bottom: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      z-index: 10;
    }

    .icon-btn {
      background: rgba(0, 0, 0, 0.4);
      border: none;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: background 0.3s;
      position: relative;
    }

    .icon-btn:hover {
      background: rgba(0, 0, 0, 0.6);
    }

    .icon-btn span {
      font-size: 20px;
    }

    .icon-btn p {
      font-size: 10px;
      margin: 2px 0 0 0;
      line-height: normal;
    }

    .red-dot {
      width: 10px;
      height: 10px;
      background-color: #ff3b30;
      border-radius: 50%;
      position: absolute;
      top: -2px;
      right: -2px;
      border: 2px solid #0b0f19;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="interactions">
      <button class="icon-btn" id="subscribe-btn">
        <span>➕</span>
        <p>Abonner</p>
        <div class="red-dot"></div>
      </button>
      
      <button class="icon-btn" id="like-btn">
        <span id="like-icon">🤍</span>
        <p id="like-count">431</p>
      </button>
      
      <button class="icon-btn">
        <span>💬</span>
        <p>0</p>
      </button>
      
      <button class="icon-btn" id="favorite-btn">
        <span id="favorite-icon">🔖</span>
        <p>Favoris</p>
      </button>
      
      <button class="icon-btn">
        <span>🔊</span>
        <p>Son</p>
      </button>
      
      <button class="icon-btn">
        <span>🔗</span>
        <p>Partager</p>
      </button>
    </div>
  </div>

  <script>
    const likeBtn = document.getElementById('like-btn');
    const likeIcon = document.getElementById('like-icon');
    const likeCount = document.getElementById('like-count');
    let isLiked = false;

    likeBtn.addEventListener('click', () => {
      isLiked = !isLiked;
      if (isLiked) {
        likeIcon.textContent = '❤️';
        likeCount.textContent = '432'; 
      } else {
        likeIcon.textContent = '🤍';
        likeCount.textContent = '431';
      }
    });

    const favoriteBtn = document.getElementById('favorite-btn');
    const favoriteIcon = document.getElementById('favorite-icon');
    let isFavorited = false;

    favoriteBtn.addEventListener('click', () => {
      isFavorited = !isFavorited;
      if (isFavorited) {
        favoriteIcon.textContent = '❤️'; 
      } else {
        favoriteIcon.textContent = '🔖';
      }
    });
  </script>

</body>
</html>
