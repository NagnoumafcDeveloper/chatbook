```html
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBook</title>
    <style>
      body {
          margin: 0;
          font-family: Arial, sans-serif;
          background-color: #000;
          color: #fff;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          overflow: hidden;
      }
      .video-container {
          position: relative;
          width: 375px;
          height: 812px;
          background-color: #333;
      }
      .sidebar {
          position: absolute;
          right: 15px;
          bottom: 100px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 20px;
      }
      .action-item {
          display: flex;
          flex-direction: column;
          align-items: center;
          color: #fff;
          cursor: pointer;
      }
      .action-item span {
          font-size: 12px;
          margin-top: 5px;
      }
      .icon {
          width: 35px;
          height: 35px;
          display: flex;
          justify-content: center;
          align-items: center;
          font-size: 24px;
      }
      .follow-btn {
          width: 30px;
          height: 30px;
          background-color: #fe2c55;
          border-radius: 50%;
          display: flex;
          justify-content: center;
          align-items: center;
          color: #fff;
          font-weight: bold;
          cursor: pointer;
          position: relative;
          margin-top: -10px;
      }
      .follow-btn.followed {
          background-color: #fff;
          color: #fe2c55;
      }
      .favoris-icon.active {
          color: #ffcc00;
      }
      .modal {
          display: none; 
          position: absolute;
          bottom: 0;
          left: 0;
          width: 100%;
          height: 50%;
          background: #111;
          border-top-left-radius: 15px;
          border-top-right-radius: 15px;
          flex-direction: column;
      }
      .modal.active {
          display: flex;
      }
      .modal-header {
          display: flex;
          justify-content: space-between;
          padding: 10px;
          border-bottom: 1px solid #333;
      }
      .close-btn {
          cursor: pointer;
      }
      .comments-list {
          flex: 1;
          overflow-y: auto;
          padding: 10px;
      }
      .comment-input {
          display: flex;
          padding: 10px;
          background: #222;
      }
      .comment-input input {
          flex: 1;
          border: none;
          background: none;
          color: #fff;
          padding: 10px;
      }
      .comment-input button {
          border: none;
          background: #fe2c55;
          color: #fff;
          padding: 10px 15px;
          cursor: pointer;
      }
    </style>
</head>
<body>

<div class="video-container">
   <div class="sidebar">
       <div class="follow-btn" id="followBtn" onclick="toggleFollow()">+</div>

       <div class="action-item" onclick="toggleFavorite()">
           <div class="icon favoris-icon" id="favorisIcon">🔖</div>
           <span id="favorisText">Favoris</span>
       </div>

       <div class="action-item" onclick="openComments()">
           <div class="icon">💬</div>
           <span id="commentCount">1</span>
       </div>
   </div>
</div>

<div class="modal" id="commentModal">
    <div class="modal-header">
        <strong>Commentaires</strong>
        <span class="close-btn" onclick="closeComments()">X</span>
    </div>
    <div class="comments-list" id="commentsList">
        <div>User1: Super vidéo !</div>
    </div>
    <div class="comment-input">
        <input type="text" id="commentTextInput" placeholder="Ajouter un commentaire...">
        <button onclick="addComment()">Publier</button>
    </div>
</div>

<script>
    function toggleFollow() {
        const btn = document.getElementById("followBtn");
        btn.classList.toggle("followed");
        if (btn.classList.contains("followed")) {
            btn.innerText = "✓";
        } else {
            btn.innerText = "+";
        }
    }

    function toggleFavorite() {
        const icon = document.getElementById("favorisIcon");
        const text = document.getElementById("favorisText");
        
        icon.classList.toggle("active");
        if (icon.classList.contains("active")) {
            text.innerText = "Favori"; 
        } else {
            text.innerText = "Favoris";
        }
    }

    function openComments() {
        document.getElementById("commentModal").classList.add("active");
    }

    function closeComments() {
        document.getElementById("commentModal").classList.remove("active");
    }

    function addComment() {
        const input = document.getElementById("commentTextInput");
        const text = input.value.trim();
        if (text !== "") {
            const list = document.getElementById("commentsList");
            const newComment = document.createElement("div");
            newComment.innerText = "Vous : " + text;
            list.appendChild(newComment);
            input.value = "";
            
            const countSpan = document.getElementById("commentCount");
            let count = parseInt(countSpan.innerText);
            countSpan.innerText = count + 1;
        }
    }
</script>

</body>
</html>
