<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Feed</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Conteneur principal du style téléphone */
    .app-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      height: 100vh;
      max-height: 800px;
      background: #111;
      overflow: hidden;
    }

    /* Emplacement pour la vidéo */
    .video-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #222;
      color: #888;
    }

    /* Boutons verticaux à droite */
    .tiktok-actions {
      position: absolute;
      right: 15px;
      bottom: 80px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      z-index: 10;
    }

    .action-btn {
      background: none;
      border: none;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 12px;
      cursor: pointer;
    }

    .action-btn .icon {
      width: 45px;
      height: 45px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      margin-bottom: 4px;
    }

    /* Description et nom d'utilisateur en bas à gauche */
    .tiktok-info {
      position: absolute;
      left: 15px;
      bottom: 20px;
      z-index: 10;
      max-width: 75%;
    }

    .tiktok-info .username {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .tiktok-info .caption {
      font-size: 14px;
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Remplacez ce bloc par votre balise <video> plus tard -->
    <div class="video-placeholder">
      <p>Vidéo ici</p>
    </div>

    <!-- Boutons d'action à droite -->
    <div class="tiktok-actions">
      <button class="action-btn">
        <span class="icon">❤️</span>
        <span>12.5k</span>
      </button>
      <button class="action-btn">
        <span class="icon">💬</span>
        <span>342</span>
      </button>
      <button class="action-btn">
        <span class="icon">↪️</span>
        <span>Partager</span>
      </button>
    </div>

    <!-- Texte en bas à gauche -->
    <div class="tiktok-info">
      <div class="username">@utilisateur</div>
      <div class="caption">Ceci est la description de la vidéo ! #tiktok #demo</div>
    </div>
  </div>

</body>
</html>
