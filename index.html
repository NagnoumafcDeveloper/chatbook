<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ChatBook</title>
<style>
:root {
  --red: #ff3159;
  --cyan: #28e7e7;
  --white: #fff;
  --muted: #bbb;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: var(--white);
  font-family: Arial, Helvetica, sans-serif;
}
button, a { -webkit-tap-highlight-color: transparent; }
button { color: inherit; font: inherit; }
.app {
  width: 100%;
  height: 100dvh;
  max-width: 520px;
  margin: auto;
  position: relative;
  overflow: hidden;
  background: #000;
}
.feed {
  height: 100%;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
  overscroll-behavior-y: contain;
}
.feed::-webkit-scrollbar { display: none; }
.video-card {
  width: 100%;
  height: 100%;
  height: 100dvh;
  position: relative;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  overflow: hidden;
  background: #202020;
}
.video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #202020;
}
.video-card::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(to bottom,
    rgba(0,0,0,.65), transparent 22%,
    transparent 48%, rgba(0,0,0,.15) 65%,
    rgba(0,0,0,.78) 100%);
}
.header {
  position: absolute;
  z-index: 5;
  top: max(0px, env(safe-area-inset-top));
  left: 0;
  right: 0;
  height: 68px;
  padding: 18px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.logo {
  font-size: 30px;
  letter-spacing: -1.6px;
  font-weight: 900;
  color: white;
  text-decoration: none;
}
.logo span { color: var(--red); }
.header-actions { display: flex; gap: 22px; }
.icon-button {
  background: transparent;
  border: 0;
  padding: 4px;
  cursor: pointer;
  display: grid;
  place-items: center;
}
.icon-button svg {
  width: 25px;
  height: 25px;
  fill: none;
  stroke: white;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.side {
  position: absolute;
  z-index: 4;
  right: 14px;
  bottom: calc(130px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}
.side-button {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  background: transparent;
  border: 0;
  padding: 0;
  cursor: pointer;
  color: white;
  font-size: 14px;
  font-weight: bold;
  text-shadow: 0 1px 3px #000;
}
.side-button svg {
  width: 34px;
  height: 34px;
  fill: white;
  filter: drop-shadow(0 1px 2px #333);
}
.side-button .outline {
  fill: none;
  stroke: white;
  stroke-width: 1.8;
}
.side-button.liked svg { fill: var(--red); }
.avatar {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  border: 3px solid white;
  background: linear-gradient(135deg,#ff2c75,#a52cff);
  display: grid;
  place-items: center;
  font-size: 27px;
  font-weight: bold;
  position: relative;
}
.follow-plus {
  position: absolute;
  bottom: -8px;
  left: 50%;
  transform: translateX(-50%);
  width: 23px;
  height: 23px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--red);
  font-size: 21px;
  line-height: 1;
  border: 1px solid #111;
}
.video-info {
  position: absolute;
  z-index: 3;
  left: 20px;
  bottom: calc(104px + env(safe-area-inset-bottom));
  width: calc(100% - 112px);
  text-shadow: 0 1px 4px #000;
}
.author { font-size: 19px; font-weight: 800; margin-bottom: 12px; }
.description { font-size: 16px; line-height: 1.45; margin-bottom: 13px; }
.music-line { font-size: 14px; display: flex; gap: 9px; align-items: center; }
.music-line svg { width: 19px; height: 19px; fill: white; }
.bottom-nav {
  position: absolute;
  z-index: 8;
  bottom: 0;
  left: 0;
  right: 0;
  height: calc(83px + env(safe-area-inset-bottom));
  padding: 9px 3px calc(12px + env(safe-area-inset-bottom));
  display: flex;
  align-items: center;
  justify-content: space-around;
  background: rgba(0,0,0,.93);
  border-radius: 0 0 24px 24px;
}
.nav-item {
  min-width: 0;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-decoration: none;
  color: #aaa;
  font-size: 12px;
  background: transparent;
  border: 0;
  cursor: pointer;
}
.nav-item svg {
  width: 25px;
  height: 25px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.nav-item.active { color: white; font-weight: bold; }
.publish {
  width: 58px;
  height: 35px;
  border-radius: 11px;
  background: white;
  color: black;
  font-size: 30px;
  font-weight: bold;
  border: 0;
  box-shadow: -5px 0 var(--red), 5px 0 var(--cyan);
  display: grid;
  place-items: center;
  line-height: 1;
}
.toast {
  display: none;
  position: absolute;
  z-index: 20;
  top: 45%;
  left: 50%;
  transform: translate(-50%,-50%);
  background: rgba(25,25,25,.94);
  padding: 13px 20px;
  border-radius: 12px;
  font-size: 14px;
  white-space: nowrap;
}
.toast.show { display: block; }
@media (min-width: 600px) {
  body { background: #191919; }
  .app { box-shadow: 0 0 35px #000; }
}
</style>
</head>
<body>
<div class="app">
  <main class="feed" id="feed">
    <section class="video-card">
      <video class="video" loop muted autoplay playsinline preload="auto"
        poster="https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=900&q=85">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-bright-red-tulip-in-the-garden-4422-large.mp4" type="video/mp4">
      </video>

      <header class="header">
        <a class="logo" href="#" aria-label="ChatBook">Chat<span>Book</span></a>
        <div class="header-actions">
          <button class="icon-button" aria-label="Rechercher" onclick="notify('La recherche sera ajoutée ensuite')">
            <svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.5"/><path d="m16 16 5 5"/></svg>
          </button>
          <button class="icon-button" id="soundBtn" aria-label="Activer le son">
            <svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4H4z"/><path d="M17 9a5 5 0 0 1 0 6"/><path d="m3 3 18 18"/></svg>
          </button>
        </div>
      </header>

      <aside class="side">
        <button class="side-button" onclick="notify('Le profil sera disponible après la création des comptes')">
          <span class="avatar">C<span class="follow-plus">+</span></span>
        </button>
        <button class="side-button" id="likeBtn" aria-label="J’aime">
          <svg viewBox="0 0 24 24"><path d="M12 21s-9-5.8-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.2-9 12-9 12z"/></svg>
          <span id="likes">1,2 K</span>
        </button>
        <button class="side-button" onclick="notify('Les commentaires seront ajoutés ensuite')">
          <svg class="outline" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 3.9a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z"/></svg>
          <span>128</span>
        </button>
        <button class="side-button" onclick="sharePage()">
          <svg viewBox="0 0 24 24"><path d="M14 9V4l8 8-8 8v-5C7 15 4 18 2 21c1-7 4-12 12-12z"/></svg>
          <span>Partager</span>
        </button>
        <button class="side-button" id="discBtn">
          <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13" fill="white"/><ellipse cx="6" cy="18" rx="3" ry="2.5"/><ellipse cx="18" cy="16" rx="3" ry="2.5"/></svg>
          <span>Son</span>
        </button>
      </aside>

      <div class="video-info">
        <div class="author">@chatbook_officiel</div>
        <div class="description">Bienvenue sur ChatBook 🌍 Découvre les vidéos et partage tes meilleurs moments</div>
        <div class="music-line">
          <svg viewBox="0 0 24 24"><path d="M12 3v12a4 4 0 1 1-2-3.46V6l12-3v12a4 4 0 1 1-2-3.46V3z"/></svg>
          <span>Son original · ChatBook</span>
        </div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" onclick="navAction('Accueil',this)">
      <svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10h-6v-6H9v6H3z"/></svg><span>Accueil</span>
    </button>
    <button class="nav-item" onclick="navAction('Découvrir',this)">
      <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span>Découvrir</span>
    </button>
    <button class="nav-item" onclick="notify('La publication vidéo sera activée à la prochaine étape')">
      <span class="publish">+</span><span>Publier</span>
    </button>
    <button class="nav-item" onclick="navAction('Messages',this)">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/></svg><span>Messages</span>
    </button>
    <button class="nav-item" onclick="navAction('Profil',this)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2z"/></svg><span>Profil</span>
    </button>
  </nav>
  <div class="toast" id="toast"></div>
</div>
<script>
const video = document.querySelector('.video');
const soundBtn = document.getElementById('soundBtn');

function notify(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
}

soundBtn.addEventListener('click', () => {
  video.muted = !video.muted;
  soundBtn.innerHTML = video.muted
    ? '<svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4H4z"/><path d="M17 9a5 5 0 0 1 0 6"/><path d="m3 3 18 18"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4H4z"/><path d="M17 9a5 5 0 0 1 0 6M14 5a9 9 0 0 1 0 14"/></svg>';
  if (!video.paused) return;
  video.play().catch(() => {});
});

document.getElementById('likeBtn').addEventListener('click', function() {
  this.classList.toggle('liked');
  document.getElementById('likes').textContent =
    this.classList.contains('liked') ? '1,3 K' : '1,2 K';
});

document.getElementById('discBtn').addEventListener('click', () => {
  video.muted = !video.muted;
  soundBtn.click();
});

function sharePage() {
  if (navigator.share) {
    navigator.share({ title: 'ChatBook', text: 'Découvre ChatBook !', url: location.href }).catch(() => {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(location.href).then(() => notify('Lien copié !'))
      .catch(() => notify('Partage bientôt disponible'));
  } else {
    notify('ChatBook bientôt disponible au partage');
  }
}

function navAction(name, element) {
  document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
  element.classList.add('active');
  if (name !== 'Accueil') notify(name + ' sera développé à la prochaine étape');
}

video.play().catch(() => {});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) video.pause();
  else video.play().catch(() => {});
});
</script>
</body>
</html>
