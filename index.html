<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBook</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .video-container {
            position: relative;
            background: black;
            width: 100%;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .actions {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            border-top: 1px solid #ddd;
            background: #fff;
        }
        .action-btn {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: #333;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .action-btn:hover {
            color: #1877f2;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Zone de la vidéo -->
        <div class="video-container">
            <video id="mainVideo" src="votre-video.mp4" loop playsinline autoplay controls></video>
        </div>

        <!-- Boutons d'interaction (Like, Commentaire, Partage) -->
        <div class="actions">
            <button class="action-btn" id="likeBtn">❤️ J'aime</button>
            <button class="action-btn" id="commentBtn">💬 Commenter</button>
            <button class="action-btn" id="shareBtn">↗️ Partager</button>
        </div>
    </div>

    <script>
        // Gestion simple des interactions
        const likeBtn = document.getElementById('likeBtn');
        let liked = false;
        likeBtn.addEventListener('click', () => {
            liked = !liked;
            likeBtn.style.color = liked ? '#e41e3f' : '#333';
            likeBtn.textContent = liked ? '❤️ Aimé' : '❤️ J\'aime';
        });

        const shareBtn = document.getElementById('shareBtn');
        shareBtn.addEventListener('click', () => {
            if (navigator.share) {
                navigator.share({
                    title: 'ChatBook Video',
                    url: window.location.href
                }).catch(console.error);
            } else {
                alert("Le partage n'est pas supporté par votre navigateur.");
            }
        });
    </script>

</body>
</html>
