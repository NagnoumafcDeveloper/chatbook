<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBook - Inscription</title>
    <!-- Chargement officiel de Supabase -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #000000 0%, #1a0002 50%, #4a0005 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .signup-container {
            background-color: #111111;
            width: 90%;
            max-width: 400px;
            padding: 35px 25px;
            border-radius: 20px;
            border: 1px solid #222222;
            box-shadow: 0 10px 30px rgba(229, 9, 20, 0.15);
            text-align: center;
            box-sizing: border-box;
        }
        h1 {
            color: #e50914;
            font-size: 36px;
            font-weight: bold;
            margin: 0 0 5px 0;
            letter-spacing: 1px;
        }
        p {
            color: #aaaaaa;
            font-size: 16px;
            margin: 0 0 25px 0;
        }
        .input-group {
            position: relative;
            margin-bottom: 16px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #333333;
            border-radius: 8px;
            background-color: #1a1a1a;
            color: #ffffff;
            box-sizing: border-box;
            font-size: 16px;
        }
        input::placeholder {
            color: #777777;
        }
        input:focus {
            outline: none;
            border-color: #e50914;
        }
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 20px;
            user-select: none;
        }
        .btn-signup {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: #e50914;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        .btn-signup:hover {
            background-color: #b80710;
        }
        .divider {
            border-top: 1px solid #222222;
            margin: 20px 0;
        }
        .login-link {
            color: #e50914;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="signup-container">
    <h1>ChatBook</h1>
    <p>C'est rapide et facile.</p>
    
    <!-- Sécurité onsubmit pour empêcher le blocage 405 de GitHub -->
    <form id="signupForm" onsubmit="event.preventDefault();">
        <div class="input-group">
            <input type="text" id="prenom" placeholder="Prénom" required>
        </div>
        
        <div class="input-group">
            <input type="text" id="nom" placeholder="Nom de famille" required>
        </div>
        
        <div class="input-group">
            <input type="text" id="email" placeholder="Numéro de mobile ou e-mail" required>
        </div>
        
        <div class="input-group">
            <input type="password" id="password" placeholder="Nouveau mot de passe" required>
            <span class="password-toggle" id="togglePassword">👁️</span>
        </div>
        
        <button type="submit" class="btn-signup">S'inscrire</button>
    </form>
    
    <div class="divider"></div>
    
    <a href="#" class="login-link">Vous avez déjà un compte ?</a>
</div>

<script>
// Initialisation de votre projet Supabase avec vos clés exactes
const SUPABASE_URL = "https://supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_DucLDxgJL-poE8KrN_9bnA_K-D0a34b2259be265f247dcbfce76ca80630b9ee7";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const togglePassword = document.querySelector('#togglePassword');
const password = document.querySelector('#password');

// Gestion du petit œil pour masquer/afficher
togglePassword.addEventListener('click', function () {
    const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
    password.setAttribute('type', type);
    this.textContent = type === 'password' ? '👁️' : '🙈';
});

// Envoi réel des formulaires vers Supabase et redirection
document.getElementById('signupForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const prenom = document.getElementById('prenom').value;
    const nom = document.getElementById('nom').value;
    const email = document.getElementById('email').value;
    const mot_de_passe = password.value;

    // Envoi des informations dans votre table "utilisateurs" sur Supabase
    const { error } = await supabaseClient
        .from('utilisateurs')
        .insert([
            { prenom: prenom, nom: nom, email: email, mot_de_passe: mot_de_passe }
        ]);

    if (error) {
        alert("Erreur Supabase : " + error.message);
    } else {
        // Enregistre localement le badge de connexion obligatoire pour l'accueil
        localStorage.setItem('chatbook_connecte', 'true');
        // Ouvre proprement la page d'accueil
        window.location.href = 'accueil.html';
    }
});
</script>

</body>
</html>
