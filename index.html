<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ChatBook - TikTok Mode Interactif</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 10px 20px;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            gap: 12px;
        }

        .top-nav .logo {
            font-size: 1.6rem;
            font-weight: 900;
            color: #fe2c55;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
            letter-spacing: -0.5px;
        }

        .tabs-categories {
            display: flex;
            gap: 10px;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
        }

        .tabs-categories span {
            font-size: 0.85rem;
            font-weight: bold;
            opacity: 0.6;
            cursor: pointer;
            padding: 6px 14px;
            border-radius: 15px;
            transition: all 0.2s;
        }

        .tabs-categories span.active {
            opacity: 1;
            background-color: #fe2c55;
            color: #ffffff;
        }

        /* CONTENEUR DE DEFILEMENT VERTICAL POUR TOUTES LES VIDEOS */
        .app-feed-container {
            width: 100%;
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }

        .app-feed-container::-webkit-scrollbar {
            display: none;
        }

        /* CHAQUE ECRAN PREND 100% DE LA HAUTEUR DU TELEPHONE */
        .video-card-item {
            position: relative;
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000000;
        }

        .video-element {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-sidebar-left {
            position: absolute;
            bottom: 80px;
            left: 15px;
            z-index: 10;
            max-width: 75%;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
        }

        .video-sidebar-left .username { font-weight: bold; font-size: 1.1rem; margin-bottom: 6px; color: #fe2c55; }
        .video-sidebar-left .description { font-size: 0.95rem; line-height: 1.4; color: #ffffff; }

        .video-sidebar-right {
            position: absolute;
            bottom: 120px;
            right: 15px;
            z-index: 80;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .action-button-touch {
            background: none;
            border: none;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            outline: none;
        }

        .icon-circle {
            width: 50px;
            height: 50px;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin-bottom: 4px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .icon-circle.liked { color: #fe2c55; }

        .action-button-touch span {
            font-size: 0.8rem;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        /* PANNEAU DE COMMENTAIRES */
        .comment-sheet {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 60vh;
            background-color: #161722;
            color: #ffffff;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            z-index: 200;
            transition: bottom 0.3s ease-out;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        .comment-sheet.open { bottom: 0; }
        .comment-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; padding-bottom: 10px; border-bottom: 1px solid #2f303d; }
        .comment-close { font-size: 1.4rem; cursor: pointer; color: #8a8b91; }
        .comment-body-scroll { flex: 1; overflow-y: auto; padding: 10px 0; }
        .comment-box-item { margin-bottom: 12px; font-size: 0.9rem; }
        .comment-author { font-weight: bold; color: #fe2c55; margin-right: 5px; }
        
        .comment-footer-input { display: flex; gap: 10px; padding-top: 10px; border-top: 1px solid #2f303d; }
        .comment-footer-input input { flex: 1; padding: 12px; border: none; border-radius: 20px; font-size: 0.95rem; background-color: #2f303d; color: #ffffff; outline: none; }
        .comment-btn-send { background-color: #fe2c55; color: #ffffff; border: none; padding: 0 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }

        /* FENÊTRE ÉDUCATIVE POUR LES ENFANTS */
        .congrats-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #ffffff;
            color: #000000;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 300;
            text-align: center;
            width: 85%;
            max-width: 320px;
            display: none;
        }
        .congrats-modal.show { display: block; }
        .congrats-btn { background-color: #25d366; color: #ffffff; border: none; padding: 12px 25px; border-radius: 20px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    </style>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div class="top-nav">
        <div class="logo">ChatBook</div>
        <div class="tabs-categories">
            <span id="tab-tous" class="active" onclick="changeFilter('tous')">Tous</span>
            <span id="tab-humour" onclick="changeFilter('humour')">😂 Humour</span>
            <span id="tab-motivation" onclick="changeFilter('motivation')">💪 Motivation</span>
            <span id="tab-enfants" onclick="changeFilter('enfants')">👶 Enfants</span>
        </div>
    </div>

    <!-- LE FLUX DYNAMIQUE QUI VA CONTENIR TOUTES LES VIDÉOS -->
    <div class="app-feed-container" id="appMainFeed">
        <!-- Rempli automatiquement par le script JavaScript -->
    </div>

    <!-- BOÎTE D'ÉDUCATION DES ENFANTS -->
    <div class="congrats-modal" id="kidsAlertBox">
        <h2 style="color: #25d366;">🎉 Félicitations !</h2>
        <p style="margin-top: 10px; font-size: 0.95rem; line-height: 1.4;">Tu es un enfant très sage et très concentré sur tes études. Continue d'apprendre pour devenir quelqu'un de grand ! 📚✏️</p>
        <button class="congrats-btn" onclick="closeKidsAlert()">Continuer à grandir 🧠</button>

    <!-- VOLET DE COMMENTAIRES -->
    <div id="bottomCommentSheet" class="comment-sheet">
        <div class="comment-header">
            <span>Commentaires</span>
            <span class="comment-close" onclick="closeComments()">✕</span>
        </div>
        <div class="comment-body-scroll" id="commentsContainer">
            <div class="comment-box-item"><span class="comment-author">@Alpha_Tech:</span> Magnifique application ! 🇬🇳</div>
            <div class="comment-box-item"><span class="comment-author">@Mariama_Dev:</span> Parfait pour la famille. 😍</div>
        </div>
        <div class="comment-footer-input">
            <input type="text" id="newCommentInput" placeholder="Ajouter un commentaire...">
            <button type="button" class="comment-btn-send" onclick="sendComment()">Envoyer</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_KEY = "sb_publishable_DucLDxgJL-poE8KrN_9bnA_K-D0aGOS";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let activeFilter = "tous";
        let activeKidsTimer = null;

        window.addEventListener('DOMContentLoaded', () => {
            loadAllVideosFromDatabase();
        });

        // 🚀 LA FONCTION INTERACTIVE POUR CHARGER ABSOLUMENT TOUTES LES VIDÉOS EN BOUCLE
        async function loadAllVideosFromDatabase() {
            const feed = document.getElementById('appMainFeed');
            feed.innerHTML = ""; // Vide le flux

            try {
                let query = supabase.from('videos').select('*');
                
                // Gestion du tri par onglet
                if (activeFilter !== "tous") {
                    let searchCat = activeFilter;
                    if(activeFilter === "enfants") searchCat = "enfant"; // Correspondance avec ta table
                    query = query.eq('categorie', searchCat);
                }

                const { data: listVideos, error } = await query;

                if (listVideos && listVideos.length > 0) {
