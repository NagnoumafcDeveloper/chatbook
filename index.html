<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatBook</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1e29;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 400px;
      height: 100vh;
      background-color: #0b0f19;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .categories {
      position: absolute;
      top: 20px;
      display: flex;
      gap: 15px;
      font-weight: bold;
      opacity: 0.8;
      z-index: 10;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .interactions {
      position: absolute;
      right: 15px;
      bottom: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      z-index: 10;
    }

    .icon-btn {
      background: rgba(0, 0, 0, 0.4);
      border: none;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: background 0.3s;
    }

    .icon-btn:hover {
      background: rgba(0, 0, 0, 0.6);
    }

    .icon-btn span {
      font-size: 20px;
    }

    .icon-btn p {
      font-size: 10px;
      margin: 2px 0 0 0;
      line-height: normal;
    }

    .video-info {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 80px;
      z-index: 10;
    }

    .username {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 5px;
    }

    .description {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 10px;
    }

    .next-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      padding: 10px 15px;
      border-radius: 20px;
      color: white;
      cursor: pointer;
      font-size: 14px;
      z-index: 10;
      backdrop-filter: blur(5px);
    }
  </style>
</head>
