```html
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBook</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .video-container {
            position: relative;
            width: 375px;
            height: 812px;
            background-color: #333;
        }
        .sidebar {
            position: absolute;
            right: 15px;
            bottom: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #fff;
            cursor: pointer;
        }
        .action-item span {
            font-size: 12px;
            margin-top: 5px;
        }
        .icon {
            width: 35px;
            height: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }
        .favoris-icon.active {
            color: #ffcc00; /* Devient jaune quand c'est favori */
        }
    </style>
</head>
<body>

<div class="video-container">
   <div class="sidebar">
       <!-- Bouton Favoris -->
       <div class="action-item" onclick="toggleFavorite()">
           <div class="icon favoris-icon" id="favorisIcon">🔖</div>
           <span id="favorisText">Favoris</span>
       </div>
   </div>
</div>

<script>
    function toggleFavorite() {
        const icon = document.getElementById("favorisIcon");
        const text = document.getElementById("favorisText");
        
        icon.classList.toggle("active");
        if (icon.classList.contains("active")) {
            text.innerText = "Favoris"; 
        } else {
            text.innerText = "Favoris";
        }
    }
</script>

</body>
</html>
