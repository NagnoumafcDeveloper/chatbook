<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBook</title>
    <style>
        body {
            margin: 0;
            background-color: #0f172a; /* Bleu foncé uniforme */
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background-color: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .categories {
            display: flex;
            justify-content: space-around;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            font-size: 14px;
            font-weight: bold;
        }
        .categories span {
            cursor: pointer;
        }
        .video-area {
            height: 500px;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .sidebar-actions {
            position: absolute;
            right: 15px;
            bottom: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .action-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            text-align: center;
            font-size: 12px;
        }
        .action-btn span {
            display: block;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- En-tête avec les catégories -->
        <div class="categories">
            <span>[😄 Humour]</span>
            <span>[💪 Motivation]</span>
            <span>[👶 Enfants]</span>
        </div>

        <!-- Zone de la vidéo -->
        <div class="video-area">
            <!-- Insérez votre balise vidéo ou iframe ici -->
            <!-- <video src="votre-video.mp4" controls autoplay loop></video> -->
        </div>

        <!-- Boutons d'actions à droite (J'aime, Commentaires, Partager) -->
        <div class="sidebar-actions">
            <button class="action-btn">
                <span>❤️</span> 432
            </button>
            <button class="action-btn">
                <span>💬</span> 0
            </button>
            <button class="action-btn">
                <span>🔊</span> Son
            </button>
            <button class="action-btn">
                <span>↗️</span> Partager
            </button>
        </div>
    </div>

</body>
</html>
