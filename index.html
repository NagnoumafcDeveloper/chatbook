<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatBook</title>
<style>
body{background:#2563eb;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:Arial}
.card{background:white;width:90%;max-width:380px;border-radius:20px;padding:28px 22px}
h1{color:#0a7cff;text-align:center;margin:0}
p{color:#888;text-align:center;font-size:14px;margin:8px 0 20px}
input{width:100%;padding:14px;margin-bottom:12px;border:none;background:#f1f5f9;border-radius:10px;box-sizing:border-box}
button.btn{width:100%;background:#22c55e;color:white;border:none;padding:13px;border-radius:10px;font-weight:bold;cursor:pointer}
a{color:#0a7cff;text-align:center;display:block;margin-top:16px;font-size:13px;text-decoration:none}
</style>
</head>
<body>
<div class="card">
<h1>ChatBook</h1>
<p>C'est rapide et facile.</p>
<input id="prenom" placeholder="Prénom">
<input id="nom" placeholder="Nom">
<input id="email" placeholder="Numéro ou e-mail">
<input id="pass" type="password" placeholder="Mot de passe">
<button class="btn" onclick="go()">S'inscrire</button>
<a href="#">Vous avez déjà un compte?</a>
</div>
<script>
function go(){
  let p=document.getElementById('prenom').value;
  let n=document.getElementById('nom').value;
  let e=document.getElementById('email').value;
  let m=document.getElementById('pass').value;
  if(!p||!n||!e||!m){alert("Remplis tout");return}
  alert("Compte créé : "+p+" "+n);
}
</script>
</body>
</html>
