<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBook - TikTok Mode</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #4a154b, #2b1055);
            overflow: hidden;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            padding: 15px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .categories {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            z-index: 10;
        }
        .category-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .category-btn.active, .category-btn:hover {
            background: white;
            color: #2b1055;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .main-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 78vh;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .sidebar {
            position: absolute;
            right: 15px;
            bottom: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        .action-btn {
            background: rgba(0, 0, 0, 0.5);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            font-size: 20px;
            transition: transform 0.2s;
        }
        .action-btn:hover {
            transform: scale(1.1);
        }
        .action-btn span {
            font-size: 11px;
            margin-top: 3px;
            font-weight: bold;
        }
        .video-info {
            position: absolute;
            left: 15px;
            bottom: 20px;
            max-width: 75%;
            z-index: 10;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        .video-info h3 {
            font-size: 16px;
            color: #00ffcc;
            margin-bottom: 5px;
        }
        .video-info p {
            font-size: 13px;
            color: #eee;
            line-height: 1.4;
        }

        /* Fenêtre de commentaires (Modal) */
        #commentModal {
            display: none;
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 420px;
            height: 50vh;
            background: #1e1e2f;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
            z-index: 100;
            flex-direction: column;
            padding: 20px;
        }
        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
        .comment-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .comment-item {
            background: rgba(255,255,255,0.05);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
        }
        .comment-input-area {
            display: flex;
            gap: 10px;
        }
        .comment-input-area input {
            flex: 1;
            padding: 10px;
            border-radius: 20px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
            outline: none;
        }
        .comment-input-area button {
            background: #00ffcc;
            border: none;
            padding: 0 15px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            color: #1e1e2f;
        }
    </style>
</head>
<body>

    <header>ChatBook</header>

    <!-- Catégories -->
    <div class="categories">
        <button class="category-btn active" onclick="switchCategory('humour', this)">😄 Humour</button>
        <button class="category-btn" onclick="switchCategory('motivation', this)">💪 Motivation</button>
        <button class="category-btn" onclick="switchCategory('enfants', this)">👶 Enfants</button>
    </div>

    <!-- Conteneur Vidéo Principal -->
    <div class="main-container">
        <video id="videoPlayer" src="" controls autoplay muted loop></video>

        <!-- Boutons d'interaction à droite -->
        <div class="sidebar">
            <!-- Le cœur est blanc par défaut (#ffffff) -->
            <button class="action-btn" id="likeBtn" onclick="toggleLike()" style="color: white;">
                ❤️ <span id="likeCount">12.5K</span>
            </button>
            <button class="action-btn" onclick="openComments()">
                💬 <span id="commentCount">2</span>
            </button>
            <button class="action-btn" onclick="shareVideo()">
                🔗 <span>Partager</span>
            </button>
        </div>

        <!-- Informations de la vidéo -->
        <div class="video-info">
            <h3 id="videoAuthor">@NagnoumaDeveloper</h3>
            <p id="videoDesc">Préparez-vous à rire ! Les meilleures vidéos d'humour positives sont ici. 🤣 ✨ #détente</p>
        </div>
    </div>

    <!-- Panneau de Commentaires -->
    <div id="commentModal">
        <div class="comment-header">
            <span id="commentTitle">Commentaires (2)</span>
            <button class="close-btn" onclick="closeComments()">✕</button>
        </div>
        <div class="comment-list" id="commentList">
            <!-- Les commentaires s'afficheront ici -->
        </div>
        <div class="comment-input-area">
            <input type="text" id="commentInput" placeholder="Ajouter un commentaire...">
            <button onclick="addComment()">Envoyer</button>
        </div>
    </div>

    <script>
        const database = {
            humour: {
                url: 'https://www.w3schools.com/html/mov_bbb.mp4',
                author: '@NagnoumaDeveloper',
                desc: 'Préparez-vous à rire ! Les meilleures vidéos d\'humour positives sont ici. 🤣 ✨ #détente',
                likes: 12500,
                liked: false,
                commentsList: ["Trop drôle cette vidéo 😂", "J'adore !"]
            },
            motivation: {
                url: 'https://www.w3schools.com/html/movie.mp4',
                author: '@MotivationDaily',
                desc: 'Ne lâchez rien, chaque petit effort compte pour réussir vos grands projets ! 🚀💪',
                likes: 8400,
                liked: false,
                commentsList: ["Tellement vrai, merci pour la motivation.", "Let's go ! 💪"]
            },
            enfants: {
                url: 'https://www.w3schools.com/html/mov_bbb.mp4',
                author: '@KidsFun',
                desc: 'De superbes moments de joie et de rires pour les enfants ! 👶✨',
                likes: 3200,
                liked: false,
                commentsList: ["Trop mignon !", "Génial pour les petits."]
            }
        };

        let currentCategory = 'humour';

        function loadCategoryData(category) {
            currentCategory = category;
            const data = database[category];
            const player = document.getElementById('videoPlayer');

            player.src = data.url;
            document.getElementById('videoAuthor').innerText = data.author;
            document.getElementById('videoDesc').innerText = data.desc;
            document.getElementById('likeCount').innerText = formatNumber(data.likes);
            document.getElementById('commentCount').innerText = data.commentsList.length;

            // Appliquer la couleur du cœur (Blanc par défaut, Rouge si liké)
            const likeBtn = document.getElementById('likeBtn');
            likeBtn.style.color = data.liked ? '#ff4d4d' : 'white';

            player.play().catch(e => console.log("Lecture automatique gérée :", e));
        }

        function switchCategory(category, btnElement) {
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            loadCategoryData(category);
            closeComments();
        }

        function toggleLike() {
            const data = database[currentCategory];
            const likeBtn = document.getElementById('likeBtn');

            if (!data.liked) {
                data.likes++;
                data.liked = true;
                likeBtn.style.color = '#ff4d4d'; // Devient rouge
            } else {
                data.likes--;
                data.liked = false;
                likeBtn.style.color = 'white'; // Revient au blanc
            }
            document.getElementById('likeCount').innerText = formatNumber(data.likes);
        }

        function openComments() {
            const data = database[currentCategory];
            const modal = document.getElementById('commentModal');
            const list = document.getElementById('commentList');
            
            list.innerHTML = '';
            data.commentsList.forEach(cmt => {
                list.innerHTML += `<div class="comment-item">${cmt}</div>`;
            });

            document.getElementById('commentTitle').innerText = `Commentaires (${data.commentsList.length})`;
            modal.style.display = 'flex';
        }

        function closeComments() {
            document.getElementById('commentModal').style.display = 'none';
        }

        function addComment() {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if (text !== '') {
                const data = database[currentCategory];
                data.commentsList.push(text);
                input.value = '';
                openComments(); // Rafraîchir la liste
                document.getElementById('commentCount').innerText = data.commentsList.length;
            }
        }

        function shareVideo() {
            if (navigator.share) {
                navigator.share({
                    title: 'ChatBook Video',
                    url: window.location.href
                }).catch(console.error);
            } else {
                alert("Lien de la vidéo copié !");
            }
        }

        function formatNumber(num) {
            if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num;
        }

        window.onload = () => {
            loadCategoryData('humour');
        };
    </script>
</body>
</html>
