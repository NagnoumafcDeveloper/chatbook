<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBook - TikTok Mode</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        .container {
            height: 100vh;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            overflow-x: hidden;
        }
        .video-slide {
            height: 100vh;
            width: 100vw;
            position: relative;
            scroll-snap-align: start;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .video-slide video {
            height: 100%;
            width: 100%;
            object-fit: cover;
        }
        .sidebar {
            position: absolute;
            right: 15px;
            bottom: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }
        .action-btn {
            background: rgba(0, 0, 0, 0.4);
            border: none;
            color: #fff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            font-size: 18px;
        }
        .action-btn:hover {
            background: rgba(0, 0, 0, 0.6);
        }
        .action-btn.active {
            color: #ff3b5c;
        }
        .action-count {
            font-size: 12px;
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            margin-top: -10px;
        }
        .video-info {
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 80px;
            z-index: 10;
        }
        .video-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div class="container" id="feed-container">
        <div id="loading">Chargement...</div>
    </div>

    <script>
        async function loadVideos() {
            const container = document.getElementById('feed-container');
            container.innerHTML = '';

            const mockVideos = [
                {
                    id: 1,
                    title: "Première vidéo de test ChatBook",
                    url: "https://www.w3schools.com/html/mov_bbb.mp4",
                    likes: 13
                },
                {
                    id: 2,
                    title: "Deuxième vidéo de test",
                    url: "https://sample-videos.com/video123/mp4/720/big_buck_bunny_720p_1mb.mp4",
                    likes: 154
                }
            ];

            mockVideos.forEach(video => {
                const slide = document.createElement('div');
                slide.className = 'video-slide';
                slide.innerHTML = `
                    <video src="${video.url}" loop playsinline></video>
                    <div class="video-info">
                        <div class="video-title">${video.title}</div>
                    </div>
                    <div class="sidebar">
                        <button class="action-btn" onclick="toggleLike(this)">❤</button>
                        <span class="action-count like-count">${video.likes}</span>
                        <button class="action-btn" onclick="toggleComments()">💬</button>
                        <span class="action-count">0</span>
                        <button class="action-btn" onclick="shareVideo('${video.title}')">↗</button>
                        <span class="action-count">Partager</span>
                    </div>
                `;
                container.appendChild(slide);
            });

            setupVideoAutoplay();
        }

        function setupVideoAutoplay() {
            const videos = document.querySelectorAll('video');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.play().catch(() => {});
                    } else {
                        entry.target.pause();
                    }
                });
            }, { threshold: 0.7 });

            videos.forEach(video => observer.observe(video));
        }

        function toggleLike(btn) {
            btn.classList.toggle('active');
            let countSpan = btn.parentElement.querySelector('.like-count');
            let count = parseInt(countSpan.textContent);
            count = btn.classList.contains('active') ? count + 1 : count - 1;
            countSpan.textContent = count;
        }

        function toggleComments() {
            alert("La section des commentaires s'ouvrira ici !");
        }

        function shareVideo(title) {
            if (navigator.share) {
                navigator.share({
                    title: 'ChatBook',
                    text: `Regarde cette vidéo sur ChatBook : ${title}`,
                    url: window.location.href,
                }).catch(() => {});
            } else {
                alert("Lien copié dans le presse-papier !");
            }
        }

        loadVideos();
    </script>
</body>
</html>
