<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Chatbook</title>
</head>
<body>

    <div style="max-width: 400px; margin: 50px auto; font-family: Arial, sans-serif;">
        <h2>Connexion à Chatbook</h2>
        
        <form id="loginForm">
            <div style="margin-bottom: 15px;">
                <label for="email" style="display: block; margin-bottom: 5px;">Email</label>
                <input type="email" id="email" required style="width: 100%; padding: 8px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label for="password" style="display: block; margin-bottom: 5px;">Mot de passe</label>
                <input type="password" id="password" required style="width: 100%; padding: 8px;">
            </div>
            <!-- Bouton de type "button" pour éviter l'erreur 405 et le message de rechargement -->
            <button type="button" id="loginBtn" style="width: 100%; padding: 10px; background: #1877f2; color: white; border: none; cursor: pointer;">Se connecter</button>
        </form>
    </div>

    <script>
        document.getElementById('loginBtn').addEventListener('click', function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if(email && password) {
                // Redirection directe vers la page d'accueil sans passer par un serveur
                window.location.href = "accueil.html";
            } else {
                alert("Veuillez remplir tous les champs.");
            }
        });
    </script>

</body>
</html>
