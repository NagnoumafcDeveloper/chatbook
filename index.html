```html
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBook - Bien-être & Famille</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a2e; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #252545; padding: 20px; border-radius: 10px; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .actions { display: flex; justify-content: space-around; margin-top: 20px; cursor: pointer; }
        .comments-section { margin-top: 20px; border-top: 1px solid #444; padding-top: 15px; }
        .comment-input { width: 80%; padding: 10px; border-radius: 5px; border: none; }
        .send-btn { padding: 10px 15px; border-radius: 5px; border: none; background: #00bcd4; color: white; cursor: pointer; }
        .comment-list { margin-top: 15px; }
        .comment { background: #333; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>ChatBook</h2>
        <span>@NagnoumaDeveloper</span>
    </div>
    
    <p>Préparez-vous à rire ! Les meilleures vidéos d'humour positives sont ici. 🤣✨ #détente</p>

    <div class="actions">
        <div id="like-btn">🤍 <span id="like-count">12.5K</span></div>
        <div>💬 <span id="comment-count">2</span></div>
        <div id="share-btn">🔗 Partager</div>
    </div>

    <div class="comments-section">
        <div class="comment-list" id="comment-list">
            <div class="comment"><strong>@Alpha_Tech:</strong> Ce concept anti-stress est génial Lamine ! 🇬🇳</div>
            <div class="comment"><strong>@Mariama_Dev:</strong> Enfin une appli saine pour mes enfants ! 😍</div>
        </div>
        <input type="text" class="comment-input" id="comment-input" placeholder="Ajouter un commentaire...">
        <button class="send-btn" id="send-btn">Envoyer</button>
    </div>
</div>

<script>
    const likeBtn = document.getElementById('like-btn');
    const likeCount = document.getElementById('like-count');
    let isLiked = false;

    likeBtn.addEventListener('click', () => {
        let currentLikes = 12.5;
        if (!isLiked) {
            currentLikes += 0.1;
            likeBtn.style.color = '#ff4d4d';
            likeBtn.innerHTML = `❤️ <span id="like-count">${currentLikes.toFixed(1)}K</span>`;
        } else {
            likeBtn.style.color = '#fff';
            likeBtn.innerHTML = `🤍 <span id="like-count">12.5K</span>`;
        }
        isLiked = !isLiked;
    });

    const commentInput = document.getElementById('comment-input');
    const sendBtn = document.getElementById('send-btn');
    const commentList = document.getElementById('comment-list');
    const commentCount = document.getElementById('comment-count');
    let currentComments = 2;

    sendBtn.addEventListener('click', () => {
        const text = commentInput.value.trim();
        if (text !== '') {
            currentComments++;
            commentCount.innerText = currentComments;
            
            const newComment = document.createElement('div');
            newComment.classList.add('comment');
            newComment.innerHTML = `<strong>Vous:</strong> ${text}`;
            commentList.appendChild(newComment);
            
            commentInput.value = '';
        }
    });

    document.getElementById('share-btn').addEventListener('click', () => {
        navigator.clipboard.writeText(window.location.href);
        alert('Lien copié dans le presse-papier !');
    });
</script>

</body>
</html>
