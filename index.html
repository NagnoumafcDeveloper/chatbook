<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBook - TikTok Mode</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #4a154b, #2b1055);
            overflow: hidden;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            padding: 15px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .categories {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            z-index: 10;
        }
        .category-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .category-btn.active, .category-btn:hover {
            background: white;
            color: #2b1055;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .main-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 78vh;
            background: #000;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .sidebar {
            position: absolute;
            right: 15px;
            bottom: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        .action-btn {
            background: transparent;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            font-size: 24px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
            transition: transform 0.2s;
        }
        .action-btn:hover {
            transform: scale(1.1);
        }
        .action-btn span {
            font-size: 12px;
            margin-top: 3px;
            font-weight: bold;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }
        .video-info {
            position: absolute;
            left: 15px;
            bottom: 20px;
            max-width: 75%;
            z-index: 10;
            text-shadow: 0 2px 5px rgba(0,0,0,0.9);
        }
        .video-info h3 {
            font-size: 16px;
            color: #00ffcc;
            margin-bottom: 5px;
        }
        .video-info p {
            font-size: 13px;
            color: #eee;
            line-height: 1.4;
        }

        /* Indicateur de défilement */
        .scroll-hint {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.6);
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 11px;
            z-index: 10;
            color: #00ffcc;
        }

        /* Fenêtre de commentaires (Modal) */
        #commentModal {
            display: none;
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 420px;
            height: 50vh;
            background: #1e1e2f;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
            z-index: 100;
            flex-direction: column;
            padding: 20px;
        }
        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
        .comment-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .comment-item {
            background: rgba(255,255,255,0.05);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
        }
        .comment-input-area {
            display: flex;
            gap: 10px;
        }
        .comment-input-area input {
            flex: 1;
            padding: 10px;
            border-radius: 20px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
            outline: none;
        }
        .comment-input-area button {
            background: #00ffcc;
            border: none;
            padding: 0 15px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            color: #1e1e2f;
        }
    </style>
</head>
<body>

    <header>ChatBook</header>

    <!-- Catégories -->
    <div class="categories">
        <button class="category-btn active" onclick="switchCategory('humour', this)">😄 Humour</button>
        <button class="category-btn" onclick="switchCategory('motivation', this)">💪 Motivation</button>
        <button class="category-btn" onclick="switchCategory('enfants', this)">👶 Enfants</button>
    </div>

    <!-- Conteneur Vidéo Principal -->
    <div class="main-container" id="videoContainer">
        <div class="scroll-hint">📜 Faites défiler pour la suite</div>
        <video id="videoPlayer" src="" controls autoplay muted loop></video>

        <div class="sidebar">
            <!-- Le cœur est forcé en blanc par défaut -->
            <button class="action-btn" id="likeBtn" onclick="toggleLike()" style="color: white;">
                ❤️ <span id="likeCount">0</span>
            </button>
            <button class="action-btn" onclick="openComments()">
                💬 <span id="commentCount">0</span>
            </button>
            <button class="action-btn" onclick="shareVideo()">
                🔗 <span>Partager</span>
            </button>
        </div>

        <div class="video-info">
            <h3 id="videoAuthor">@Auteur</h3>
            <p id="videoDesc">Description de la vidéo...</p>
        </div>
    </div>

    <!-- Panneau de Commentaires -->
    <div id="commentModal">
        <div class="comment-header">
            <span id="commentTitle">Commentaires (0)</span>
            <button class="close-btn" onclick="closeComments()">✕</button>
        </div>
        <div class="comment-list" id="commentList"></div>
        <div class="comment-input-area">
            <input type="text" id="commentInput" placeholder="Ajouter un commentaire...">
            <button onclick="addComment()">Envoyer</button>
        </div>
    </div>

    <script>
        // Liste de plusieurs vidéos par catégorie pour permettre le défilement
        const database = {
            humour: [
                {
                    url: 'https://www.w3schools.com/html/mov_bbb.mp4',
                    author: '@NagnoumaDeveloper',
                    desc: 'Préparez-vous à rire ! Les meilleures vidéos d\'humour positives sont ici. 🤣 ✨ #détente',
                    likes: 1250,
                    liked: false,
                    commentsList: ["Trop drôle 😂", "Incroyable !"]
                },
                {
                    url: 'https://www.w3schools.com/html/movie.mp4',
                    author: '@HumourTotal',
                    desc: 'Une blague qui fait du bien dès le matin ! 🎭✨',
                    likes: 430,
                    liked: false,
                    commentsList: ["Excellent 👏"]
                }
            ],
            motivation: [
                {
                    url: 'https://www.w3schools.com/html/movie.mp4',
                    author: '@MotivationDaily',
                    desc: 'Ne lâchez rien, chaque petit effort compte pour réussir vos grands projets ! 🚀💪',
                    likes: 840,
                    liked: false,
                    commentsList: ["Tellement vrai !", "Let's go ! 💪"]
                },
                {
                    url: 'https://www.w3schools.com/html/mov_bbb.mp4',
                    author: '@MindsetMaster',
                    desc: 'La discipline bat toujours le talent brut. Restez concentrés 🎯',
                    likes: 3100,
                    liked: false,
                    commentsList: ["Citation magnifique.", "Merci pour la force !"]
                }
            ],
            enfants: [
                {
                    url: 'https://www.w3schools.com/html/mov_bbb.mp4',
                    author: '@KidsFun',
                    desc: 'De superbes moments de joie et de rires pour les enfants ! 👶✨',
                    likes: 320,
                    liked: false,
                    commentsList: ["Trop mignon !"]
                }
            ]
        };

        let currentCategory = 'humour';
        let currentIndex = 0;

        function loadCurrentVideo() {
            const list = database[currentCategory];
            if (!list || list.length === 0) return;

            const videoData = list[currentIndex];
            const player = document.getElementById('videoPlayer');

            player.src = videoData.url;
            document.getElementById('videoAuthor').innerText = videoData.author;
            document.getElementById('videoDesc').innerText = videoData.desc;
            document.getElementById('likeCount').innerText = formatNumber(videoData.likes);
            document.getElementById('commentCount').innerText = videoData.commentsList.length;

            // Réinitialisation stricte du cœur en BLANC si non liké, ROUGE si liké
            const likeBtn = document.getElementById('likeBtn');
            likeBtn.style.color = videoData.liked ? '#ff4d4d' : 'white';

            player.play().catch(e => console.log("Lecture automatique :", e));
        }

        function switchCategory(category, btnElement) {
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            currentCategory = category;
            currentIndex = 0; // Revenir à la première vidéo de la catégorie
            loadCurrentVideo();
            closeComments();
        }

        // Permet de faire défiler les vidéos avec la molette de la souris sur le conteneur
        const container = document.getElementById('videoContainer');
        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const list = database[currentCategory];
            if (e.deltaY > 0) {
                // Défilement vers le bas -> Vidéo suivante
                currentIndex = (currentIndex + 1) % list.length;
            } else {
                // Défilement vers le haut -> Vidéo précédente
                currentIndex = (currentIndex - 1 + list.length) % list.length;
            }
            loadCurrentVideo();
            closeComments();
        }, { passive: false });

        function toggleLike() {
            const videoData = database[currentCategory][currentIndex];
            const likeBtn = document.getElementById('likeBtn');

            if (!videoData.liked) {
                videoData.likes++;
                videoData.liked = true;
                likeBtn.style.color = '#ff4d4d'; // Rouge
            } else {
                videoData.likes--;
                videoData.liked = false;
                likeBtn.style.color = 'white'; // Blanc
            }
            document.getElementById('likeCount').innerText = formatNumber(videoData.likes);
        }

        function openComments() {
            const videoData = database[currentCategory][currentIndex];
            const modal = document.getElementById('commentModal');
            const list = document.getElementById('commentList');
            
            list.innerHTML = '';
            videoData.commentsList.forEach(cmt => {
                list.innerHTML += `<div class="comment-item">${cmt}</div>`;
            });

            document.getElementById('commentTitle').innerText = `Commentaires (${videoData.commentsList.length})`;
            modal.style.display = 'flex';
        }

        function closeComments() {
            document.getElementById('commentModal').style.display = 'none';
        }

        function addComment() {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if (text !== '') {
                const videoData = database[currentCategory][currentIndex];
                videoData.commentsList.push(text);
                input.value = '';
                openComments();
                document.getElementById('commentCount').innerText = videoData.commentsList.length;
            }
        }

        function shareVideo() {
            if (navigator.share) {
                navigator.share({
                    title: 'ChatBook Video',
                    url: window.location.href
                }).catch(console.error);
            } else {
                alert("Lien de la vidéo copié !");
            }
        }

        function formatNumber(num) {
            if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num;
        }

        window.onload = () => {
            loadCurrentVideo();
        };
    </script>
</body>
</html>
