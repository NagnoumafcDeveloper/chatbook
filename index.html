<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ChatBook</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto}
body{overflow:hidden}

/* --- PAGE INSCRIPTION (TA 1ERE IMAGE) --- */
#signup-page{
  background:#1e60c5;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.signup-card{
  background:white;
  width:100%;
  max-width:380px;
  border-radius:20px;
  padding:28px 22px;
  box-shadow:0 20px 40px rgba(0,0,0,0.3);
}
.signup-card h1{color:#0a7cff;text-align:center;font-size:36px;font-weight:800}
.signup-card p.sub{color:#666;text-align:center;margin:6px 0 22px;font-size:14px}
.signup-card input{
  width:100%;padding:14px 14px;margin-bottom:14px;
  border:1.5px solid #ddd;border-radius:10px;font-size:15px;outline:none
}
.signup-card input:focus{border-color:#0a7cff}
.pass-wrap{position:relative}
.pass-wrap span{position:absolute;right:14px;top:15px;cursor:pointer}
.btn-green{
  width:100%;background:#2ecc71;color:white;border:none;
  padding:14px;border-radius:10px;font-weight:bold;font-size:16px;
  cursor:pointer;margin-top:6px
}
.btn-green:active{transform:scale(0.98)}
.link-blue{color:#0a7cff;text-align:center;display:block;margin-top:22px;font-size:14px;cursor:pointer;font-weight:600}

/* --- PAGE FEED (TA 2EME IMAGE - TIKTOK) --- */
#feed-page{display:none;background:#000;color:white;height:100vh;flex-direction:column}
.header{padding:10px 12px 8px;background:#000;z-index:5}
.logo{font-size:20px;font-weight:800}.logo.c1{color:#fe2c55}
.search{
  background:#1f1f1f;border-radius:24px;padding:9px 14px;display:flex;align-items:center;gap:8px;margin-top:10px
}
.search input{background:transparent;border:none;color:white;width:100%;outline:none;font-size:14px}
.cats{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{padding:7px 14px;border-radius:20px;background:#2a2a2a;border:none;color:white;font-size:13px;white-space:nowrap;cursor:pointer}
.cat.active{background:#fe2c55;color:white}

.feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.vid-box{
  height:100%;scroll-snap-align:start;position:relative;
  background:#0a0a0a;display:flex;justify-content:center;align-items:center;
  border-bottom:1px solid #111
}
.vid-box video{height:100%;width:100%;object-fit:cover}
.vid-overlay{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,0.6) 0%,transparent 40%);pointer-events:none}
.vid-info{position:absolute;left:12px;bottom:14px;z-index:2;max-width:65%}
.vid-info b{font-size:14px}.vid-info p{font-size:12px;margin-top:4px;line-height:1.3}
.right-actions{position:absolute;right:8px;bottom:20px;z-index:3;display:flex;flex-direction:column;gap:18px;align-items:center}
.act{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;user-select:none}
.act.icon{width:44px;height:44px;background:rgba(255,255,255,0.12);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;backdrop-filter:blur(10px)}
.act span{font-size:11px;font-weight:600}
.act.liked.icon{background:#fe2c55}
.sound-btn{position:absolute;top:12px;right:12px;z-index:3;background:rgba(0,0,0,0.5);border:none;color:white;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px}

.bottom-nav{
  height:62px;background:#000;border-top:1px solid #1f1f1f;
  display:flex;justify-content:space-around;align-items:center
}
.nav{border:none;background:none;color:#777;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;cursor:pointer}
.nav.active{color:white}
.nav i{font-size:20px;font-style:normal}
</style>
</head>
<body>

<!-- INSCRIPTION -->
<div id="signup-page">
  <div class="signup-card">
    <h1>ChatBook</h1>
    <p class="sub">C'est rapide et facile.</p>
    <input id="prenom" placeholder="Prénom">
    <input id="nom" placeholder="Nom de famille">
    <input id="contact" placeholder="Numéro de mobile ou e-mail">
    <div class="pass-wrap">
      <input id="pass" type="password" placeholder="Mot de passe" value="12345678">
      <span onclick="document.getElementById('pass').type = document.getElementById('pass').type==='password'?'text':'password'">👁️</span>
    </div>
    <button class="btn-green" onclick="inscrire()">S'inscrire</button>
    <span class="link-blue" onclick="showFeed()">Vous avez déjà un compte?</span>
  </div>
</div>

<!-- FEED TIKTOK -->
<div id="feed-page">
  <div class="header">
    <div class="logo"><span class="c1">Chat</span>Book</div>
    <div class="search">🔍 <input id="searchInput" placeholder="Rechercher une vidéo ou un créateur..."></div>
    <div class="cats">
      <button class="cat active" onclick="filterCat('tous',this)">Tous</button>
      <button class="cat" onclick="filterCat('humour',this)">😂 Humour</button>
      <button class="cat" onclick="filterCat('motivation',this)">💪 Motivation</button>
      <button class="cat" onclick="filterCat('musique',this)">🎵 Musique</button>
    </div>
  </div>
  <div class="feed" id="feed"></div>
  <div class="bottom-nav">
    <button class="nav active"><i>⌂</i>Accueil</button>
    <button class="nav" onclick="alert('Recherche - bientôt')"><i>⌕</i>Recherche</button>
    <button class="nav" onclick="document.getElementById('fileInput').click()"><i>⊕</i>Publier</button>
    <button class="nav" onclick="logout()"><i>◎</i>Profil</button>
  </div>
</div>

<input type="file" id="fileInput" accept="video/*" style="display:none" onchange="publishVideo(this)">

<script>
// DONNEES VIDEO - tu peux changer les liens
let allVideos = [
  {url:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4", user:"@dakar_comedy", cat:"humour", likes:"12.3k", desc:"Quand tu dis que t'as pas d'argent 😂 #humour #senegal"},
  {url:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4", user:"@motivation_sn", cat:"motivation", likes:"45.1k", desc:"Travaille en silence, laisse le succès faire du bruit 💪"},
  {url:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4", user:"@sabar_queen", cat:"musique", likes:"89k", desc:"Nouveau son 🔥 Tu valides? 🎵"},
  {url:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4", user:"@humour_221", cat:"humour", likes:"22k", desc:"Le voisin qui écoute tout 😭"},
];

const feedEl = document.getElementById('feed');

function inscrire(){
  const p=document.getElementById('prenom').value, n=document.getElementById('nom').value;
  if(p.length<2 || n.length<2){ alert("Remplis Prénom et Nom"); return; }
  localStorage.setItem('chatbook_user', p);
  showFeed();
}
function showFeed(){
  document.getElementById('signup-page').style.display='none';
  document.getElementById('feed-page').style.display='flex';
  render(allVideos);
}
function logout(){
  localStorage.removeItem('chatbook_user');
  document.getElementById('feed-page').style.display='none';
  document.getElementById('signup-page').style.display='flex';
}
function render(list){
  feedEl.innerHTML='';
  list.forEach((v,i)=>{
    feedEl.innerHTML+=`
    <div class="vid-box" data-cat="${v.cat}">
      <video src="${v.url}" loop playsinline preload="metadata" id="v${i}" onclick="togglePlay(${i})"></video>
      <div class="vid-overlay"></div>
      <button class="sound-btn" id="s${i}" onclick="toggleSound(${i})">🔊</button>
      <div class="vid-info"><b>${v.user}</b><p>${v.desc}</p></div>
      <div class="right-actions">
        <div class="act" onclick="like(this)"><div class="icon">❤️</div><span class="like-count">${v.likes}</span></div>
        <div class="act" onclick="alert('Commentaires bientôt')"><div class="icon">💬</div><span>234</span></div>
        <div class="act" onclick="shareVideo(${i})"><div class="icon">↗️</div><span>Partage</span></div>
        <div class="act"><div class="icon">👤</div></div>
      </div>
    </div>`;
  });
  setTimeout(initAutoPlay,200);
}

function togglePlay(i){
  const vid=document.getElementById(v${i});
  if(vid.paused) vid.play(); else vid.pause();
}
function toggleSound(i){
  const vid=document.getElementById(v${i});
  vid.muted=!vid.muted;
  document.getElementById(s${i}).textContent=vid.muted?"🔇":"🔊";
}
function like(el){
  el.classList.toggle('liked');
  const countEl=el.querySelector('.like-count');
  let txt=countEl.textContent;
  if(el.classList.contains('liked')){ el.querySelector('.icon').textContent='❤️'; }
}
function filterCat(cat,btn){
  document.querySelectorAll('.cat').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(cat==='tous') render(allVideos);
  else render(allVideos.filter(v=>v.cat===cat));
}
function initAutoPlay(){
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      const vid=en.target.querySelector('video');
      if(en.isIntersecting){ vid.play().catch(()=>{}); }
      else{ vid.pause(); }
    });
  },{threshold:0.6});
  document.querySelectorAll('.vid-box').forEach(b=>obs.observe(b));
}
function shareVideo(i){
  if(navigator.share){ navigator.share({title:'ChatBook', url:allVideos[i].url}); }
  else{ alert("Lien copié! "+allVideos[i].url); }
}
function publishVideo(input){
  const file=input.files[0];
  if(!file) return;
  const url=URL.createObjectURL(file);
  allVideos.unshift({url:url, user:"@moi", cat:"tous", likes:"0", desc:"Ma nouvelle vidéo 🔥"});
  render(allVideos);
  alert("Vidéo publiée!");
}

document.getElementById('searchInput').addEventListener('input',e=>{
  const q=e.target.value.toLowerCase();
  render(allVideos.filter(v=>v.user.toLowerCase().includes(q) || v.desc.toLowerCase().includes(q)));
});

// Si déjà inscrit, va direct au feed
if(localStorage.getItem('chatbook_user')) showFeed();
</script>
</body>
</html>
