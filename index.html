<script>
  // Navigation entre les onglets
  function navigateTo(target) {
    // Masquer tous les écrans
    document.querySelectorAll('.main-screen').forEach(screen => {
      screen.classList.remove('active-screen');
    });

    // Réinitialiser les onglets
    document.getElementById('btn-tab-pourvous').classList.remove('active');
    document.getElementById('btn-tab-abonnement').classList.remove('active');

    // Activer l'écran et l'onglet sélectionnés
    if (target === 'pourvous') {
      document.getElementById('screen-pourvous').classList.add('active-screen');
      document.getElementById('btn-tab-pourvous').classList.add('active');
    } else if (target === 'abonnement') {
      document.getElementById('screen-abonnement').classList.add('active-screen');
      document.getElementById('btn-tab-abonnement').classList.add('active');
    }
  }

  // Gestion des Likes
  function handleLikeInteraction(btn) {
    const icon = btn.querySelector('.icon-circle');
    const countSpan = btn.querySelector('span');
    let count = parseInt(countSpan.textContent, 10);

    if (icon.classList.contains('liked')) {
      icon.classList.remove('liked');
      icon.textContent = '🤍';
      countSpan.textContent = count - 1;
    } else {
      icon.classList.add('liked');
      icon.textContent = '❤️';
      countSpan.textContent = count + 1;
    }
  }

  // Ouverture et fermeture du volet de commentaires
  function triggerCommentSheet() {
    document.getElementById('bottomCommentSheet').classList.add('open');
  }

  function dismissCommentSheet() {
    document.getElementById('bottomCommentSheet').classList.remove('open');
  }
</script>
